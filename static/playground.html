<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UW Pretrade Brief — Redesign Playground</title>
<style>
:root{
  --bg:#0b0d12;--panel:#12151c;--panel2:#161a23;--grid:#232836;--text:#d7dbe6;--dim:#8b93a7;
  --axis:#5a6378;--ok:#9ECE6A;--neg:#F7768E;--warn:#E0AF68;--blue:#7AA2F7;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sys:-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#07090d;color:var(--text);font-family:var(--sys);display:flex;height:100vh;overflow:hidden}
/* ── controls ── */
#controls{width:300px;min-width:300px;overflow-y:auto;padding:14px;border-right:1px solid var(--grid);background:#0a0c11}
#controls h1{font-size:13px;margin:0 0 2px;font-family:var(--mono)}
#controls .sub{font-size:10px;color:var(--dim);margin-bottom:12px}
fieldset{border:1px solid var(--grid);border-radius:8px;margin:0 0 10px;padding:8px 10px}
legend{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding:0 4px}
label{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:6px 0;gap:8px}
select,button.preset{background:var(--panel);color:var(--text);border:1px solid var(--grid);border-radius:5px;font-size:11px;padding:3px 6px;font-family:var(--mono)}
input[type=checkbox]{accent-color:var(--blue)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
button.preset{cursor:pointer;padding:5px 8px}
button.preset:hover{border-color:var(--blue)}
button.preset.active{border-color:var(--blue);color:var(--blue)}
/* ── preview ── */
#stage{flex:1;display:flex;flex-direction:column;align-items:center;overflow:hidden}
#phoneWrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;overflow:hidden;padding:10px}
#phone{width:392px;height:calc(100% - 8px);max-height:830px;background:var(--bg);border:1px solid #2a3040;border-radius:24px;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#screen{padding:14px 14px 28px;font-family:var(--mono)}
/* ── prompt bar ── */
#promptBar{width:100%;border-top:1px solid var(--grid);background:#0a0c11;padding:10px 14px}
#promptBar .row{display:flex;gap:10px;align-items:flex-start}
#prompt{flex:1;font-size:11px;color:var(--dim);font-family:var(--mono);white-space:pre-wrap;max-height:96px;overflow-y:auto;margin:0}
#copy{background:var(--blue);color:#0b0d12;border:0;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer}
/* ── mock dashboard pieces (driven by state classes) ── */
.density-cozy .tile{padding:12px 13px;margin:9px 0}
.density-compact .tile{padding:8px 11px;margin:6px 0}
.tile{background:var(--panel);border:1px solid var(--grid);border-radius:10px}
.tile .q{font-size:10px;color:var(--dim)}
.tile .big{font-size:17px;margin:2px 0}
.tile .m{font-size:10px;color:var(--dim)}
.tile .how{font-size:9px;color:var(--axis);font-style:italic;margin-top:4px}
.expl{font-size:10px;color:var(--dim);line-height:1.5;margin:3px 0 7px;font-family:var(--sys)}
.prov{float:right;font-size:8px;color:var(--axis);text-transform:uppercase}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:3px;vertical-align:1px}
.groupHead{font-size:9px;color:var(--axis);text-transform:uppercase;letter-spacing:.1em;margin:14px 2px 2px}
.conflict{outline:1px dashed var(--warn)}
.conflictNote{font-size:9px;color:var(--warn);text-align:center;margin:-3px 0 3px}
svg{display:block}
.bar{height:14px;border-radius:3px;overflow:hidden;display:flex;background:var(--grid)}
.bar i{display:block;height:100%}
a.gridrow{display:block;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:9px 11px;margin:7px 0}
.hero{border-radius:12px;padding:14px;margin:10px 0;border:1px solid var(--grid)}
.hero.sd{background:linear-gradient(180deg,rgba(247,118,142,.13),var(--panel));border-color:rgba(247,118,142,.35)}
.hero .verdict{font-size:26px;color:var(--neg);letter-spacing:.01em}
.hero .next{font-size:12px;color:var(--text);margin-top:6px;line-height:1.45}
.hero .k{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.reasons{font-size:10px;color:var(--dim);margin:8px 0 0;padding-left:14px}
.chip{display:inline-block;font-size:9px;border:1px solid var(--grid);border-radius:10px;padding:1px 7px;color:var(--dim);margin-right:4px}
.chip.red{border-color:rgba(247,118,142,.5);color:var(--neg)}
.ticket{border:1px solid var(--grid);background:var(--panel2);border-radius:10px;padding:11px 12px;margin:9px 0}
.ticket .head{display:flex;justify-content:space-between;align-items:baseline}
.ticket .sym{font-size:16px}
.ticket .px{font-size:16px;color:var(--blue)}
.stats{display:flex;gap:6px;margin-top:8px}
.stat{flex:1;background:var(--bg);border:1px solid var(--grid);border-radius:6px;padding:5px;text-align:center}
.stat b{display:block;font-size:12px;font-weight:500}
.stat span{font-size:8px;color:var(--dim);text-transform:uppercase}
.maxloss{margin-top:8px;font-size:11px;color:var(--neg);text-align:center}
.alts{display:flex;gap:6px;margin-top:8px}
.alt{flex:1;font-size:9px;color:var(--dim);border:1px dashed var(--grid);border-radius:6px;padding:4px;text-align:center}
.hist{display:flex;gap:5px;align-items:center;margin-top:6px}
.hd{width:10px;height:10px;border-radius:50%}
.mktline{font-size:10px;color:var(--dim);margin:2px 0 4px}
.mktline b{color:var(--warn);font-weight:500}
/* ── mobile: stack panes, free the phone frame ── */
@media (max-width:760px){
  body{flex-direction:column;height:auto;overflow:auto}
  #controls{width:100%;min-width:0;border-right:0;border-bottom:1px solid var(--grid);max-height:none}
  #controls .cwrap{display:none}
  #controls.open .cwrap{display:block}
  #ctoggle{display:block;width:100%;background:var(--panel);color:var(--blue);border:1px solid var(--grid);border-radius:8px;padding:9px;font-size:13px;font-family:var(--mono);cursor:pointer;margin-top:8px}
  #stage{overflow:visible}
  #phoneWrap{padding:8px 0;overflow:visible}
  #phone{width:100%;max-height:none;height:auto;border-radius:0;border-left:0;border-right:0;overflow:visible}
  #promptBar{position:static}
}
@media (min-width:761px){#ctoggle{display:none}}
</style>
</head>
<body>
<div id="controls">
  <h1>Redesign Playground</h1>
  <div class="sub">tweak → preview → copy the prompt into the Claude-design session</div>
  <button id="ctoggle" onclick="document.getElementById('controls').classList.toggle('open');this.textContent=this.textContent.startsWith('⚙')?'✕ close options':'⚙ options & presets'">⚙ options &amp; presets</button>
  <div class="cwrap">
  <fieldset><legend>Presets</legend><div class="presets" id="presets"></div></fieldset>
  <fieldset><legend>Screen</legend>
    <label>Preview screen <select data-k="screen"><option value="ticker">Ticker brief</option><option value="grid">Hot-ticker grid</option></select></label>
  </fieldset>
  <fieldset><legend>Structure</legend>
    <label>Evidence grouping <select data-k="grouping"><option value="grouped">3 named groups</option><option value="flat">Flat list</option></select></label>
    <label>Density <select data-k="density"><option value="cozy">Cozy</option><option value="compact">Compact</option></select></label>
    <label>Tile labels <select data-k="labels"><option value="questions">Plain questions</option><option value="short">Short titles</option></select></label>
  </fieldset>
  <fieldset><legend>Hero (the call)</legend>
    <label>Style <select data-k="heroStyle"><option value="banner">Tinted banner</option><option value="word">Word only</option></select></label>
    <label>Reasons expanded <input type="checkbox" data-k="reasonsOpen"></label>
  </fieldset>
  <fieldset><legend>Charts</legend>
    <label>Chart height <select data-k="chartH"><option value="regular">Regular</option><option value="compact">Sparkline</option></select></label>
    <label>Direction visual <select data-k="dirStyle"><option value="tug">Tug-of-war bar</option><option value="split">Split bar + ticks</option></select></label>
    <label>Price candles tile <input type="checkbox" data-k="showCandles" checked></label>
    <label>Walls on price chart <input type="checkbox" data-k="wallsOnPrice" checked></label>
  </fieldset>
  <fieldset><legend>Trust layer</legend>
    <label>What-&amp;-why explainers <input type="checkbox" data-k="explain" checked></label>
    <label>"how:" rule lines <input type="checkbox" data-k="howLines" checked></label>
    <label>Provenance dots <input type="checkbox" data-k="provDots" checked></label>
    <label>History dot-strip <input type="checkbox" data-k="showHistory" checked></label>
    <label>Conflict tie-line <input type="checkbox" data-k="conflictTie" checked></label>
  </fieldset>
  </div>
</div>
<div id="stage">
  <div id="phoneWrap"><div id="phone"><div id="screen"></div></div></div>
  <div id="promptBar"><div class="row"><pre id="prompt"></pre><button id="copy">Copy prompt</button></div></div>
</div>
<script>
/* ── sample data: real shapes/values from the live API (SPY 2026-06-10) ── */
const D={
  grid:[
    {t:"MU",c:10.9,p:1.9,al:18},{t:"SPY",c:2.8,p:6.4,al:43},{t:"SPXW",c:4.2,p:3.5,al:30},
    {t:"QQQ",c:2.6,p:3.9,al:47},{t:"TSLA",c:.27,p:2.3,al:14},{t:"IWM",c:1.0,p:1.2,al:31}],
  call:{verdict:"Stand down",next:"No trade today: the 0.65% move needed to break even is more than the 0.5% the market is pricing. Check back next session.",
    reasons:["opening flow puts","OI building","tape calls vs flow puts","cost: needs 0.65% vs 0.5% priced · macro CPI <1d"]},
  mkt:{gamma:"NEG (trend)",iv:"22%",tide:"bear",event:"CPI <1d"},
  dir:{c:36.4,p:49.9,ticks:[{k:725,s:"p"},{k:728,s:"p"},{k:730,s:"p"},{k:735,s:"c"},{k:740,s:"c"}]},
  cum:[0,280,820,640,1380,2050,1820,2580,3120,2890,3380,3620],
  oi:[97,101,99,104,108,112,117,102,111,112],
  gam:{spot:725.4,cw:739,pw:724.6,rungs:[[700,2.1],[705,1.4],[710,.6],[715,-.8],[720,-2.3],[725,-3.9],[730,-2.7],[735,-1.2],[740,1.8],[745,.9],[750,.4]]},
  rr:{series:[-.041,-.044,-.047,-.049,-.052,-.048,-.047],base:-.049,thr:.01},
  cost:{priced:.5,be:.65,spread:1,ivr:61},
  ticket:{sym:"736 PUT",dte:"2d",ask:5.37,delta:.49,spread:1,theta:17,maxloss:537,
    alts:[{s:"735P",a:4.98,d:.46},{s:"737P",a:5.80,d:.52},{s:"734P",a:4.55,d:.43}]},
  candles:(()=>{let o=733.4,out=[];for(let i=0;i<26;i++){const c=o-(Math.sin(i*.7)*.8+.34);out.push({o,h:Math.max(o,c)+.7,l:Math.min(o,c)-.6,c});o=c}return out})(),
  hist:[1,0,1,1,2,1,0,1,2,1] // 1 right, 0 wrong, 2 stood down
};
/* ── state ── */
const DEF={screen:"ticker",grouping:"grouped",density:"cozy",labels:"questions",heroStyle:"banner",
  reasonsOpen:false,chartH:"regular",dirStyle:"tug",showCandles:true,wallsOnPrice:true,
  howLines:true,provDots:true,showHistory:true,conflictTie:true,explain:true};
/* per-tile explainers: WHAT data this is + WHY it matters (operator-requested pattern) */
const EXPL={
  price:"15-minute price candles for today's regular session. Context for where the walls and breakeven sit — price never decides the call.",
  dir:"Today's opening option premium, split calls vs puts. New money picking a side is the day's directional bet — but the side must dominate 2:1 and clear $500K to count as qualified; a near-even or thin lean is a coin flip and caps the call at Mixed. Tap for the receipts: the five biggest bets behind the read (time, strike, premium, who was aggressive).",
  tape:"Every option trade pushes with or against the stock (its 'delta'), signed by whether the buyer or seller was the aggressor. Summed minute by minute from zero at the open, this shows which way the tape is really leaning — against the flow means the bet is contested. The % sizes that push against the day's share volume: under 1% is noise, 5%+ is heavy, 15%+ is dominant.",
  oi:"Open interest on the bet's exact contracts, one bar per settled day (OI settles overnight, so the newest bar is yesterday). Green bars are the 5 days the verdict scores; grey is older context. Rising green supports bets building rather than exiting. Read the contract COUNTS, not the percent — weekly strikes are often days old, so growth-from-near-zero makes any % meaningless.",
  gam:"Dealer hedging pressure by strike. Negative near price amplifies moves (helps a directional bet); positive pins price to a range.",
  rr:"What protection costs today vs its own 10-day normal. Puts suddenly richer than usual = fear being bid; calls richer = upside chase.",
  cost:"The move the options market is pricing vs the move your contract needs to break even. If needed exceeds priced, the math is against you before you start.",
  ticket:"The realistic weekly you'd actually buy on the flow side, with its true costs. The premium is the most you can lose.",
  hist:"One dot per past session: did the direction call match the next day's move. Grey = the tool said stand down."
};
let S={...DEF};
const PRESETS={
  "Decision spine ★":{...DEF},
  "Terminal heritage":{...DEF,heroStyle:"word",grouping:"flat",labels:"questions",chartH:"compact",conflictTie:false,wallsOnPrice:false},
  "Dense pro":{...DEF,density:"compact",labels:"short",chartH:"compact",howLines:false,reasonsOpen:true},
  "Novice airy":{...DEF,density:"cozy",reasonsOpen:false,howLines:true,chartH:"regular"}
};
/* ── helpers ── */
const M=v=>"$"+v.toFixed(1)+"M";
const H=()=>S.chartH==="regular"?64:34;
function svgLine(pts,w,h,color,extra="",endLbl=null){
  const xs=pts.map((p,i)=>i/(pts.length-1)*w),mn=Math.min(...pts),mx=Math.max(...pts);
  const ys=pts.map(p=>h-4-((p-mn)/(mx-mn||1))*(h-8));
  const d=xs.map((x,i)=>(i?"L":"M")+x.toFixed(1)+","+ys[i].toFixed(1)).join(" ");
  let zero="";
  if(mn<0&&mx>0){const zy=h-4-((0-mn)/(mx-mn))*(h-8);zero=`<line x1="0" y1="${zy}" x2="${w}" y2="${zy}" stroke="#5a6378" stroke-dasharray="3 3"/>`}
  let lbls="";
  if(endLbl!==null){
    const ey=ys[ys.length-1],sy=ys[0];
    lbls=`<text x="2" y="${sy-4<10?sy+10:sy-4}" font-size="8" fill="#5a6378">${pts[0]===0?"0 at open (9:30)":""}</text>
    <text x="${w-2}" y="${ey-5<10?ey+11:ey-5}" font-size="8" fill="${color}" text-anchor="end">${endLbl} now</text>`;
  }
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${zero}${extra}<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6"/>${lbls}</svg>`;
}
const lbl=(q,s)=>S.labels==="questions"?q:s;
const how=t=>S.howLines?`<div class="how">how: ${t}</div>`:"";
const expl=k=>S.explain?`<div class="expl">${EXPL[k]}</div>`:"";
const prov=()=>S.provDots?`<span class="prov"><span class="dot"></span>live · 15:45</span>`:"";
function tile(q,s,big,body,extra=""){return `<div class="tile ${extra}">${prov()}<div class="q">${lbl(q,s)}</div>${big?`<div class="big">${big}</div>`:""}${body}</div>`}
/* ── chart builders ── */
function dirChart(){
  const tot=D.dir.c+D.dir.p,pc=D.dir.p/tot*100;
  if(S.dirStyle==="tug")
    return `<div class="bar"><i style="width:${100-pc}%;background:rgba(158,206,106,.75)"></i><i style="width:${pc}%;background:rgba(247,118,142,.8)"></i></div>
    <div class="m" style="display:flex;justify-content:space-between;margin-top:3px"><span style="color:var(--ok)">${M(D.dir.c)} calls</span><span style="color:var(--neg)">puts ${M(D.dir.p)}</span></div>`;
  const w=360,mn=720,mx=745;
  const ticks=D.dir.ticks.map(t=>`<line x1="${(t.k-mn)/(mx-mn)*w}" y1="2" x2="${(t.k-mn)/(mx-mn)*w}" y2="14" stroke="${t.s==="p"?"#F7768E":"#9ECE6A"}" stroke-width="2.5"/>`).join("");
  const sx=(D.gam.spot-mn)/(mx-mn)*w;
  return `<div class="bar"><i style="width:${100-pc}%;background:rgba(158,206,106,.75)"></i><i style="width:${pc}%;background:rgba(247,118,142,.8)"></i></div>
  <svg width="100%" viewBox="0 0 ${w} 16" style="margin-top:4px">${ticks}<line x1="${sx}" y1="0" x2="${sx}" y2="16" stroke="#7AA2F7" stroke-dasharray="2 2"/></svg>
  <div class="m">bet strikes vs price (blue) · ${M(D.dir.c)} c / ${M(D.dir.p)} p</div>`;
}
function oiChart(){
  const h=H()+22,w=360,mx=Math.max(...D.oi),n=D.oi.length,bw=w/n;
  const bars=D.oi.map((v,i)=>`<rect x="${i*bw+4}" y="${h-12-(v/mx)*(h-26)}" width="${bw-8}" height="${(v/mx)*(h-26)}" rx="2" fill="${i>=n-5?"#9ECE6A":"#3b4254"}"/>`).join("");
  const vals=[0,n-1].map(i=>`<text x="${i*bw+bw/2}" y="${h-16-(D.oi[i]/mx)*(h-26)}" font-size="9" fill="${i?"#9ECE6A":"#8b93a7"}" text-anchor="middle">${D.oi[i]}K</text>`).join("");
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}${vals}
    <text x="4" y="${h-2}" font-size="8" fill="#5a6378">May 27</text>
    <text x="${w-4}" y="${h-2}" font-size="8" fill="#9ECE6A" text-anchor="end">Jun 9 (last settled)</text></svg>
  <div class="m">one bar = one settled day's OI (contracts) on the bet's strikes · green = the 5 days the verdict scores (+15%) · grey = older context</div>`;
}
function gamChart(){
  const h=H()+18,w=360,ks=D.gam.rungs.map(r=>r[0]),mn=Math.min(...ks),mx=Math.max(...ks);
  const vmax=Math.max(...D.gam.rungs.map(r=>Math.abs(r[1])));
  const x=k=>(k-mn)/(mx-mn)*(w-16)+8, zy=h/2;
  const bars=D.gam.rungs.map(([k,v])=>`<rect x="${x(k)-4}" y="${v>0?zy-(v/vmax)*(zy-8):zy}" width="8" height="${Math.abs(v)/vmax*(zy-8)}" rx="1.5" fill="${v>0?"#9ECE6A":"#F7768E"}" opacity=".85"/>`).join("");
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="8" y1="${zy}" x2="${w-8}" y2="${zy}" stroke="#232836"/>${bars}
    <line x1="${x(D.gam.spot)}" y1="4" x2="${x(D.gam.spot)}" y2="${h-4}" stroke="#7AA2F7" stroke-dasharray="3 2"/>
    <line x1="${x(D.gam.cw)}" y1="4" x2="${x(D.gam.cw)}" y2="${h-4}" stroke="#9ECE6A" stroke-dasharray="2 3"/>
    <text x="${x(D.gam.cw)+3}" y="12" font-size="8" fill="#9ECE6A">wall +1.9%</text>
    <text x="${x(D.gam.spot)+3}" y="${h-7}" font-size="8" fill="#7AA2F7">price</text>
    <text x="${x(mn)}" y="${h-7}" font-size="8" fill="#5a6378">${mn}</text>
    <text x="${x(mx)}" y="${h-7}" font-size="8" fill="#5a6378" text-anchor="end">${mx} strike</text>
    <text x="2" y="11" font-size="8" fill="#9ECE6A">+ pins</text>
    <text x="2" y="${h-14}" font-size="8" fill="#F7768E">− extends</text></svg>
  <div class="m">net dealer gamma by strike · negative near price = moves extend</div>`;
}
function rrChart(){
  const h=H(),w=200,s=D.rr.series,mn=-.06,mx=-.035;
  const y=v=>h-4-((v-mn)/(mx-mn))*(h-8);
  const band=`<rect x="0" y="${y(D.rr.base+D.rr.thr)}" width="${w}" height="${y(D.rr.base-D.rr.thr)-y(D.rr.base+D.rr.thr)}" fill="#E0AF68" opacity=".12"/>`;
  const xs=s.map((_,i)=>i/(s.length-1)*(w-10)+2);
  const path=xs.map((x,i)=>(i?"L":"M")+x+","+y(s[i]).toFixed(1)).join(" ");
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${band}
    <line x1="0" y1="${y(D.rr.base)}" x2="${w}" y2="${y(D.rr.base)}" stroke="#E0AF68" stroke-dasharray="3 3" opacity=".6"/>
    <text x="2" y="${y(D.rr.base)-3}" font-size="7" fill="#E0AF68">normal ${D.rr.base}</text>
    <path d="${path}" fill="none" stroke="#7AA2F7" stroke-width="1.5"/>
    <circle cx="${xs[xs.length-1]}" cy="${y(s[s.length-1])}" r="3.4" fill="#d7dbe6"/>
    <text x="${xs[xs.length-1]-6}" y="${y(s[s.length-1])-6}" font-size="7" fill="#d7dbe6" text-anchor="end">today ${s[s.length-1]}</text></svg>
  <div class="m">last 7 days · today's dot inside the "normal" band = BALANCED</div>`;
}
function costScale(){
  const w=340,mx=1.0,x=v=>v/mx*(w-30)+15;
  return `<svg width="100%" viewBox="0 0 ${w} 44">
    <line x1="15" y1="22" x2="${w-15}" y2="22" stroke="#3b4254" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="22" x2="${x(D.cost.priced)}" y2="22" stroke="#7AA2F7" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${x(D.cost.priced)}" cy="22" r="5" fill="#7AA2F7"/><text x="${x(D.cost.priced)-22}" y="10" font-size="9" fill="#7AA2F7">priced ${D.cost.priced}%</text>
    <circle cx="${x(D.cost.be)}" cy="22" r="5" fill="#F7768E"/><text x="${x(D.cost.be)-4}" y="42" font-size="9" fill="#F7768E">need ${D.cost.be}% to break even</text></svg>
  <div class="m">the move you need sits PAST the move being priced → pass</div>`;
}
function candleChart(){
  const h=H()+14,w=360,cs=D.candles,
    mn=Math.min(...cs.map(c=>c.l),...(S.wallsOnPrice?[D.gam.pw]:[])),
    mx=Math.max(...cs.map(c=>c.h),...(S.wallsOnPrice?[D.gam.cw]:[]));
  const y=v=>h-4-((v-mn)/(mx-mn))*(h-8);
  const bars=cs.map((c,i)=>{const x=8+i*((w-30)/cs.length),up=c.c>=c.o,col=up?"#9ECE6A":"#F7768E";
    return `<line x1="${x}" y1="${y(c.h)}" x2="${x}" y2="${y(c.l)}" stroke="${col}" stroke-width="1"/><rect x="${x-2.2}" y="${y(Math.max(c.o,c.c))}" width="4.4" height="${Math.max(1.5,Math.abs(y(c.o)-y(c.c)))}" fill="${col}"/>`}).join("");
  let walls="";
  if(S.wallsOnPrice){walls=`<line x1="8" y1="${y(D.gam.cw)}" x2="${w-8}" y2="${y(D.gam.cw)}" stroke="#9ECE6A" stroke-dasharray="2 4" opacity=".7"/><text x="${w-66}" y="${y(D.gam.cw)-3}" font-size="8" fill="#9ECE6A">call wall 739</text>
  <line x1="8" y1="${y(D.gam.pw)}" x2="${w-8}" y2="${y(D.gam.pw)}" stroke="#F7768E" stroke-dasharray="2 4" opacity=".7"/><text x="${w-62}" y="${y(D.gam.pw)-3}" font-size="8" fill="#F7768E">put wall 725</text>`}
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${walls}${bars}
    <text x="10" y="${y(cs[cs.length-1].c)-4}" font-size="8" fill="#7AA2F7">last ${cs[cs.length-1].c.toFixed(2)}</text>
    <text x="10" y="${h-2}" font-size="8" fill="#5a6378">9:30</text>
    <text x="${w-8}" y="${h-2}" font-size="8" fill="#5a6378" text-anchor="end">15:45 ET</text></svg>
  <div class="m">15-min candles · regular hours · −1.09% session</div>`;
}
function histStrip(){
  const dots=D.hist.map(v=>`<span class="hd" style="background:${v===1?"#9ECE6A":v===0?"#F7768E":"#3b4254"}"></span>`).join("");
  return tile("Was it right?","Track record",`6 / 8`,
   expl("hist")+`<div class="m">direction calls that matched the next session's move</div><div class="hist">${dots}<span class="m" style="margin-left:4px">grey = stood down</span></div>`+how("scored nightly vs the next session's close"));
}
/* ── screens ── */
function tickerScreen(){
  let h=`<div style="font-size:10px;color:var(--dim)">SPY · 2026-06-10 · 15:45 ET</div>`;
  h+=`<div class="mktline">market: gamma ${D.mkt.gamma} · IV ${D.mkt.iv} · tide ${D.mkt.tide} · <b>⚠ ${D.mkt.event}</b></div>`;
  const reasons=S.reasonsOpen?`<ul class="reasons">${D.call.reasons.map(r=>`<li>${r}</li>`).join("")}</ul>`:`<div class="m" style="margin-top:7px">▸ 4 reasons</div>`;
  h+=S.heroStyle==="banner"
    ?`<div class="hero sd"><div class="k">The call · SPY</div><div class="verdict">${D.call.verdict}</div><div class="next">${D.call.next}</div>${reasons}</div>`
    :`<div style="margin:12px 0"><div class="k" style="font-size:9px;color:var(--dim)">THE CALL · SPY</div><div class="verdict" style="font-size:24px;color:var(--neg)">${D.call.verdict}</div><div class="next" style="font-size:11px;margin-top:4px">${D.call.next}</div>${reasons}</div>`;
  if(S.showCandles)h+=tile("Today's tape","Price",`$725.41 <span style="font-size:11px;color:var(--neg)">−1.09%</span>`,expl("price")+candleChart()+how("price context only, the call never comes from price"));
  const g1=tile("Where's the money betting?","Direction","PUTS",expl("dir")+dirChart()+how("side with more opening premium wins"))
    +(S.conflictTie?`<div class="conflictNote">⚠ the live tape disagrees with the flow ↓</div>`:"")
    +tile("Does the live tape agree?","Tape","CALLS <span class='chip red'>disagrees</span>",expl("tape")+svgLine(D.cum,360,H(),"#9ECE6A","","+3.6K")+`<div class="m">+3.6K net directional delta, building · 4.2% of share volume</div>`+how("sign of the session net delta"),S.conflictTie?"conflict":"")
    +tile("Is the bet being held?","OI","GROWING",expl("oi")+oiChart()+how("OI up = held, down = closing"));
  const g2=tile("Will moves extend or fade?","Gamma","EXTEND",expl("gam")+gamChart()+how("negative gamma extends moves, positive pins"))
    +tile("Which way is fear priced?","Skew","BALANCED",expl("rr")+rrChart()+how("today's risk reversal vs its own recent normal"));
  const g3=tile("Is it worth the cost?","Cost",`PASS <span class="chip">spread 1%</span><span class="chip">IV rank 61</span>`,expl("cost")+costScale()+how("pass on event, earnings, or spread bigger than the move"))
    +`<div class="ticket">${prov()}<div class="q">${lbl("Which contract (if you act anyway)?","The ticket")}</div>${expl("ticket")}
      <div class="head"><span class="sym">SPY ${D.ticket.sym} · ${D.ticket.dte}</span><span class="px">$${D.ticket.ask}</span></div>
      <div class="stats"><div class="stat"><b>0.49</b><span>delta</span></div><div class="stat"><b>1%</b><span>spread</span></div><div class="stat"><b>17%/d</b><span>theta</span></div><div class="stat"><b>0.65%</b><span>breakeven</span></div></div>
      <div class="maxloss">max loss $537 per contract — weeklies routinely expire worthless</div>
      <div class="alts">${D.ticket.alts.map(a=>`<div class="alt">${a.s} · $${a.a} · Δ${a.d}</div>`).join("")}</div></div>`;
  if(S.grouping==="grouped"){
    h+=`<div class="groupHead">The bet — and is it real?</div>`+g1
      +`<div class="groupHead">The terrain</div>`+g2
      +`<div class="groupHead">The gate &amp; the ticket</div>`+g3;
  } else h+=g1+g2+g3;
  if(S.showHistory)h+=`<div class="groupHead">${S.grouping==="grouped"?"The receipts":""}</div>`+histStrip();
  return h;
}
function gridScreen(){
  const mx=Math.max(...D.grid.map(r=>r.c+r.p));
  let h=`<div style="font-size:10px;color:var(--dim);margin-bottom:8px">HOT TICKERS · today's opening premium (recent tape)</div>`;
  h+=[...D.grid].sort((a,b)=>(b.c+b.p)-(a.c+a.p)).map(r=>{
    const tot=r.c+r.p,w=tot/mx*100;
    return `<a class="gridrow" href="#"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${r.t}</span><span style="color:var(--dim);font-size:10px">${M(tot)} · ${r.al} alerts</span></div>
    <div class="bar" style="margin-top:6px;width:${w}%"><i style="width:${r.c/tot*100}%;background:rgba(158,206,106,.75)"></i><i style="width:${r.p/tot*100}%;background:rgba(247,118,142,.8)"></i></div></a>`}).join("");
  h+=`<div class="m" style="margin-top:10px;color:var(--axis)">bar length = total $ · green calls / red puts · open a ticker for its full-session direction</div>`;
  return h;
}
/* ── render + prompt ── */
function render(){
  const sc=document.getElementById("screen");
  sc.parentElement.className="";sc.className="density-"+S.density;
  sc.innerHTML=S.screen==="grid"?gridScreen():tickerScreen();
  document.querySelectorAll("#controls [data-k]").forEach(el=>{
    const k=el.dataset.k;
    if(el.type==="checkbox")el.checked=S[k];else el.value=S[k];
  });
  document.querySelectorAll("#presets button").forEach(b=>b.classList.toggle("active",JSON.stringify(PRESETS[b.textContent])===JSON.stringify(S)));
  updatePrompt();
}
function updatePrompt(){
  const p=[];
  p.push(`Redesign the UW Pretrade Brief frontend (static/index.html + present.py copy) as a phone-first (390px) decision spine. Keep the dark JetBrains-Mono terminal heritage and ALL existing server data (Element.series powers every chart; the frontend computes nothing).`);
  p.push(`Hero: "${S.heroStyle==="banner"?"a tinted traffic-light banner":"a plain colored verdict word"}" for THE CALL with the next_step sentence directly beneath; reasons ${S.reasonsOpen?"expanded by default":"collapsed behind a tap"}.`);
  p.push(`Evidence: ${S.grouping==="grouped"?'three named groups — "The bet — and is it real?" (direction tug-of-war bar, cum-delta sparkline with zero line, OI daily bars with the 5-session window highlighted), "The terrain" (gamma profile with price line + walls, RR dot against its 10-day normal band), "The gate & the ticket" (breakeven-vs-priced-move two-marker scale, broker-ticket contract card)':"a flat tile list with the same charts"}; ${S.chartH==="regular"?"regular-height charts":"sparkline-height charts"}; direction drawn as ${S.dirStyle==="tug"?"a green/red tug-of-war bar":"a split bar plus bet-strike tick marks against the price"}.`);
  p.push(`${S.showCandles?`Include the "Today's tape" 15-min candle tile${S.wallsOnPrice?" with the call/put walls overlaid on the price axis":""}.`:"Omit the price-candles tile."}`);
  if(S.explain)p.push(`Every tile carries a 1-2 sentence plain-English explainer of WHAT data it shows and WHY it matters, in this exact pattern (final copy lives server-side in present.py): direction "${EXPL.dir}" · tape "${EXPL.tape}" · OI "${EXPL.oi}" · gamma "${EXPL.gam}" · skew "${EXPL.rr}" · cost "${EXPL.cost}" · ticket "${EXPL.ticket}" · price "${EXPL.price}" · history "${EXPL.hist}"`);
  p.push(`Verdict tones (hard rule): Favorable green, Stand down red, and Mixed SPLIT into two visually distinct flavors — contradicted ("tape disagrees", reads closer to Stand down) vs fell-short ("weak basis", plain amber). The split is driven by the server's signal_conflict flag; the frontend only styles it.`);
  p.push(`Chart literacy (hard rule): every chart carries minimal axis anchors — a caption saying what ONE bar/point IS (with units), first/last x labels (dates or times), and the key y values (zero line, latest value, baseline). Any grey-vs-color encoding is explained in the caption. No naked sparklines. Sizes are only comparable within a tile's own yardstick (delta vs share volume, OI vs its own history); never imply premium dollars and delta shares are the same scale.`);
  p.push(`Trust layer: ${S.howLines?"keep":"drop"} the italic "how:" rule lines; ${S.provDots?"show":"hide"} live/stale provenance dots; ${S.conflictTie?"visually flag flow-vs-tape disagreement between the two tiles (amber tie)":"no special conflict treatment"}; ${S.showHistory?'end with a "Was it right?" history dot-strip (green/red/grey) and the hit-rate figure':"no history strip"}. Density: ${S.density}. Tile labels: ${S.labels==="questions"?"plain-English questions":"short titles"}.`);
  p.push(`Grid screen: rows as premium-length bars split green-calls/red-puts (no side word — it is a sample), alert counts, tap-through to the brief.`);
  p.push(`Hard rules: one verdict word on the page; no posture words on the market line; unavailable/n-a/truncation states stay visible; no math in JS (CI-enforced); re-run scripts/capture_golden_vm.py after copy changes.`);
  document.getElementById("prompt").textContent=p.join("\n");
}
/* ── wire up ── */
const pr=document.getElementById("presets");
Object.keys(PRESETS).forEach(name=>{const b=document.createElement("button");b.className="preset";b.textContent=name;
  b.onclick=()=>{S={...PRESETS[name]};render()};pr.appendChild(b)});
document.querySelectorAll("#controls [data-k]").forEach(el=>{
  el.addEventListener("change",()=>{S[el.dataset.k]=el.type==="checkbox"?el.checked:el.value;render()})});
document.getElementById("copy").onclick=async()=>{
  await navigator.clipboard.writeText(document.getElementById("prompt").textContent);
  const b=document.getElementById("copy");b.textContent="Copied!";setTimeout(()=>b.textContent="Copy prompt",1200)};
render();
</script>
</body>
