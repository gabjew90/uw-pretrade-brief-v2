<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UW Pretrade Brief v3</title>
  <style>
    :root {
      --bg: #0b0d12; --panel: #12151c; --grid: #232836; --text: #d7dbe6;
      --text-dim: #8b93a7; --axis: #5a6378; --ok: #9ECE6A; --neg: #F7768E; --warn: #E0AF68;
      --ff-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--ff-mono);
           -webkit-font-smoothing: antialiased; }
    header { padding: 14px 16px; border-bottom: 1px solid var(--grid); }
    header h1 { font-size: 14px; margin: 0; letter-spacing: 0.04em; }
    header .sub { font-size: 10px; color: var(--text-dim); margin-top: 3px; }
    main { padding: 16px; max-width: 560px; }
    .note { color: var(--axis); font-size: 11px; line-height: 1.5; max-width: 60ch; }
    /* verdict blocks — one per direction, the only big words on the page */
    .dirblock { border: 1px solid var(--grid); border-radius: 6px; padding: 12px 14px;
                margin: 0 0 10px; background: var(--panel); }
    .dirblock .k { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em;
                   color: var(--text-dim); }
    .verdict { font-size: 22px; margin: 4px 0 6px; letter-spacing: 0.02em; }
    .v-perfect { color: var(--ok); }
    .v-notnow { color: var(--text); }
    .waiting { font-size: 11px; color: var(--text-dim); margin: 0 0 8px; line-height: 1.45; }
    /* gate lights: dot + plain-English label. NOT tappable, NO numbers here. */
    .gaterow { display: flex; align-items: center; gap: 9px; padding: 3px 0;
               font-size: 11.5px; color: var(--text); }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .d-GREEN { background: var(--ok); }
    .d-RED { background: var(--neg); }
    .d-DARK { background: #3b4254; }
    .g-DARK { color: var(--text-dim); }
    /* the four numbers (only near-PERFECT) */
    .numbers { border: 1px solid var(--grid); border-radius: 6px; background: var(--panel);
               padding: 10px 14px; margin: 0 0 10px; font-size: 12px; line-height: 1.7; }
    /* the ONE disclosure: everything else lives behind it */
    .whybtn { display: block; width: 100%; background: var(--panel); color: var(--text-dim);
              border: 1px solid var(--grid); border-radius: 6px; padding: 9px;
              font-family: var(--ff-mono); font-size: 11px; cursor: pointer; margin: 4px 0 10px; }
    .whybtn:hover { border-color: var(--axis); }
    #why { display: none; }
    #why.open { display: block; }
    .gtable { font-size: 10.5px; color: var(--text-dim); border: 1px solid var(--grid);
              border-radius: 6px; background: var(--panel); padding: 8px 12px; margin: 8px 0; }
    .gtable .row { display: flex; gap: 8px; padding: 2px 0; }
    .gtable .gn { width: 132px; flex: none; color: var(--text); }
    .gtable .gs { width: 44px; flex: none; }
    .vlogic { color: var(--axis); font-size: 10px; font-style: italic; max-width: 70ch;
              margin: 8px 0; }
    /* hot-ticker grid (landing view) */
    .grid a { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px;
              margin: 6px 0; border: 1px solid var(--grid); border-radius: 6px;
              background: var(--panel); color: var(--text); text-decoration: none; }
    .grid a:hover { border-color: var(--axis); }
    .grid .t { font-size: 14px; }
    .grid .s { color: var(--text-dim); font-size: 11px; }
    .gridnote { color: var(--axis); font-size: 10px; margin: 6px 0 0; }
    .nav { font-size: 11px; margin: 0 0 10px; }
    .nav a { color: var(--text-dim); text-decoration: none; }
    .nav input { background: var(--panel); border: 1px solid var(--grid); color: var(--text);
                 font-family: var(--ff-mono); font-size: 11px; padding: 4px 8px;
                 border-radius: 4px; width: 90px; text-transform: uppercase; }
    /* why-panel evidence cards (the old tiles, behind the disclosure) */
    .el { border: 1px solid var(--grid); border-radius: 6px; padding: 10px 12px; margin: 8px 0;
          background: var(--panel); cursor: pointer; }
    .el .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .el .k { font-size: 11px; letter-spacing: 0.02em; color: var(--text); }
    .el .prov { font-size: 9px; color: var(--axis); text-transform: uppercase;
                letter-spacing: 0.04em; white-space: nowrap; }
    .el .surface { font-size: 20px; margin-top: 5px; }
    .el .meaning { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.45;
                   max-width: 64ch; }
    .el .logic { font-size: 10px; color: var(--axis); margin-top: 4px; font-style: italic; }
    .el .detail { margin-top: 8px; border-top: 1px dashed var(--grid); padding-top: 8px;
                  font-size: 11px; color: var(--text-dim); display: none; }
    .el.open .detail { display: block; }
    .el .detail .row { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; }
    .el .detail .row .v { color: var(--text); }
    .t-positive .surface { color: var(--ok); }
    .t-negative .surface { color: var(--neg); }
    .t-cautionary { border-left: 2px solid var(--warn); }
    .t-cautionary .surface { color: var(--warn); }
    .t-unavailable { opacity: 0.55; border-left: 2px solid var(--axis); }
    .q-degraded { box-shadow: inset 2px 0 0 var(--warn); }
    .q-archive { box-shadow: inset 2px 0 0 var(--axis); }
  </style>
</head>
<body>
  <header>
    <h1>UW Pretrade Brief v3</h1>
    <div class="sub" id="status">loading…</div>
  </header>
  <main>
    <div id="verdict"></div>
    <div id="view"></div>
  </main>
  <script>
    // The ENTIRE client contract: fetch the typed view model and render it. It paints
    // server-supplied fields (state, label, numbers) and never inspects a signal value
    // to decide an outcome — no direction/threshold/clock math.
    function esc(s) {
      return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
    }
    function detailRows(detail) {
      if (!detail || typeof detail !== "object") return "";
      return Object.keys(detail).map(k =>
        `<div class="row"><span>${esc(k)}</span><span class="v">${esc(
          typeof detail[k] === "number" ? detail[k].toLocaleString() : detail[k]
        )}</span></div>`).join("");
    }
    function srcLabel(p) {
      const m = { live: "live", cache: "cached", archive: "settled", derived: "computed" };
      const src = (p && p.source) || "derived", q = (p && p.quality) || "real";
      if (q === "unavailable") return "no data";
      if (q === "degraded") return (m[src] || src) + " · degraded";
      return m[src] || src;
    }
    function freshness(p) {
      if (!p || !p.as_of) return "";
      return p.as_of.slice(0, 10) + " " + p.as_of.slice(11, 16);
    }
    function elementCard(e) {
      const tone = (e.tone || "neutral"), q = (e.provenance && e.provenance.quality) || "real";
      const src = (e.provenance && e.provenance.source) || "";
      const surface = e.surface == null
        ? "<span style='color:var(--axis)'>n/a</span>" : esc(e.surface);
      const fresh = freshness(e.provenance);
      const prov = `<div class="prov">${esc(srcLabel(e.provenance))}${fresh ? " · " + esc(fresh) : ""}</div>`;
      const meaning = e.meaning ? `<div class="meaning">${esc(e.meaning)}</div>` : "";
      const logic = e.logic ? `<div class="logic">how: ${esc(e.logic)}</div>` : "";
      return `<div class="el t-${tone} q-${q} ${src === "archive" ? "q-archive" : ""}">
        <div class="head"><div class="k">${esc(e.label || e.key)}</div>${prov}</div>
        <div class="surface">${surface}</div>
        ${meaning}
        ${logic}
        <div class="detail">${detailRows(e.detail)}</div>
      </div>`;
    }
    // one direction's verdict block + its gate lights (server state, painted verbatim)
    function dirBlock(ticker, dc, branchTag, waitingLine) {
      if (!dc) return "";
      const word = dc.state === "PERFECT"
        ? `PERFECT — ${esc(dc.direction.toUpperCase())}`
        : `NOT NOW — ${dc.green}/${dc.total}`;
      const cls = dc.state === "PERFECT" ? "v-perfect" : "v-notnow";
      const lights = (dc.gates || []).map(g =>
        `<div class="gaterow g-${g.state}"><span class="dot d-${g.state}"></span>${esc(g.label)}</div>`
      ).join("");
      return `<div class="dirblock">
        <div class="k">${esc(dc.direction)} · ${esc(ticker)}${branchTag}</div>
        <div class="verdict ${cls}">${word}</div>
        ${waitingLine}
        ${lights}
      </div>`;
    }
    function gateTable(title, gates) {
      if (!gates || !gates.length) return "";
      return `<div class="gtable"><b style="color:var(--text)">${esc(title)}</b>` +
        gates.map(g =>
          `<div class="row"><span class="gn">${esc(g.name)}</span><span class="gs g-${g.state}">${esc(g.state)}</span>
           <span>${(g.values || []).map(esc).join(" · ")}
           ${g.provenance && g.provenance.as_of ? " | " + esc(freshness(g.provenance)) : ""}</span></div>`
        ).join("") + `</div>`;
    }
    async function render(ticker) {
      const view = document.getElementById("view");
      try {
        const vm = await (await fetch(`/api/view/${encodeURIComponent(ticker)}`)).json();
        document.getElementById("status").textContent =
          `${vm.ticker} · as of ${vm.as_of || "?"}`;
        const v = vm.verdict || {};
        const branchTag = v.branch === "catalyst" ? " · earnings window" : "";
        const best = v.direction === "puts" ? v.puts : v.calls;
        const other = v.direction === "puts" ? v.calls : v.puts;
        const waiting = vm.next_step
          ? `<div class="waiting">${esc(vm.next_step)}</div>` : "";
        const numbers = (vm.numbers && vm.numbers.length)
          ? `<div class="numbers">${vm.numbers.map(esc).join("<br>")}</div>` : "";
        document.getElementById("verdict").innerHTML =
          dirBlock(vm.ticker, best, branchTag, waiting) +
          dirBlock(vm.ticker, other, branchTag, "") +
          numbers +
          `<button class="whybtn" id="whybtn">why? — every value, threshold and source</button>`;
        // the ONE disclosure: everything deleted from the default render lives here
        const cards = (vm.regime ? [vm.regime] : []).concat(vm.elements || []);
        view.innerHTML = `<div id="why">` +
          (vm.verdict_logic ? `<div class="vlogic">how the call is made: ${esc(vm.verdict_logic)}</div>` : "") +
          gateTable("calls gates", v.calls && v.calls.gates) +
          gateTable("puts gates", v.puts && v.puts.gates) +
          (cards.map(elementCard).join("") || "") +
          `</div>`;
        document.getElementById("whybtn").addEventListener("click", () =>
          document.getElementById("why").classList.toggle("open"));
        view.querySelectorAll(".el").forEach(c =>
          c.addEventListener("click", () => c.classList.toggle("open")));
      } catch (err) {
        view.innerHTML = `<p class='note'>view unavailable: ${esc(err)}</p>`;
      }
    }
    // Landing = the hot-ticker grid (one cross-ticker call); a ticker renders the brief.
    async function renderGrid() {
      const view = document.getElementById("view");
      document.getElementById("status").textContent = "hot tickers · today's opening premium";
      try {
        const g = await (await fetch("/api/grid")).json();
        document.getElementById("verdict").innerHTML =
          `<div class="nav"><form onsubmit="location.search='?t='+this.t.value.trim().toUpperCase();return false;">
             go to ticker: <input name="t" placeholder="SPY" /></form></div>`;
        view.innerHTML = `<div class="grid">` + (g.rows || []).map(r =>
          `<a href="?t=${encodeURIComponent(r.ticker)}">
             <span class="t">${esc(r.ticker)}</span>
             <span class="s">${esc(r.premium_fmt)} · ${esc(r.call_fmt)} c · ${esc(r.put_fmt)} p · ${r.alerts} alerts</span>
           </a>`).join("") + `</div>` +
          (g.note ? `<p class="gridnote">${esc(g.note)}</p>` : "");
      } catch (err) {
        view.innerHTML = `<p class='note'>grid unavailable: ${esc(err)}</p>`;
      }
    }
    const _t = new URLSearchParams(location.search).get("t");
    if (_t) {
      document.getElementById("verdict").insertAdjacentHTML("beforebegin",
        `<div class="nav"><a href="./">← hot tickers</a></div>`);
      render(_t);
    } else {
      renderGrid();
    }
  </script>
</body>
</html>
