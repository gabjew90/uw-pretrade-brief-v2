  // re-ranks Tile 4 for the chosen side and re-frames the deep-dive (you choose).
  const dirToggle = `<span class="dir-toggle" style="margin-left:8px;" title="Direction defaults to the opening-flow read — flip it to rank the other side.">`
    + `<button class="t3-tog ${row.direction === 'calls' ? 'on' : ''}" onclick="setDeepDiveDirection('${row.ticker}','calls')">CALLS</button>`
    + `<button class="t3-tog ${row.direction === 'puts' ? 'on' : ''}" onclick="setDeepDiveDirection('${row.ticker}','puts')">PUTS</button></span>`;
  // Honesty marker: say how the side was chosen. "manual" = you flipped it (so
  // it must NOT claim flow/gamma picked it); otherwise flag the weaker bases.
  const _db = row.direction_basis;
  const basisTag = _db === "operator_override"
    ? `<span class="dir-basis manual" title="You flipped this side manually.">manual</span>`
    : (_db && _db !== "opening_flow")
    ? `<span class="dir-basis" title="Side derived from a weaker basis than opening flow.">via ${_db === "total_flow" ? "total flow" : "gamma (weak)"}</span>`
    : "";
  // Deep-dive carries its OWN as_of: a just-refreshed grid row can be newer than
  // an open deep-dive (a prior full build) — show both ages honestly rather than
  // letting one masquerade as the other.
  const ddAsOf = row.as_of
    ? ` <span class="dd-asof" title="deep-dive build age — independent of the grid">deep-dive as of ${new Date(row.as_of).toISOString().slice(11, 16)}Z</span>`
    : "";
  titleEl.innerHTML = `Deep-dive card — <span style="font-family:var(--ff-display);font-style:italic;font-weight:500;font-size:22px;letter-spacing:-0.02em;color:var(--title);text-transform:none;">${row.ticker}</span>${dirToggle}${basisTag}${lu}${ddAsOf}`;
  c.innerHTML = `<div class="deepdive-card">${renderAllTiles(row)}</div>`;
}

function renderAllTiles(row) {
  // Assembles the deep-dive: Tile 1 (flow) · Tile 2 (OI) · Tile 3 (structural,
  // rich when the on-demand /api/tile3 detail has loaded, else the structural
  // fallback) · Tile 4 (contract picker, rich when /api/tile4 has loaded).
  const detail = state.tile3Detail[row.ticker];
  const tile3 = (detail && detail.status === "ok")
    ? renderTile3Rich(row, detail)
    : renderTile3Structural(row);
  // Tile 4 = Contract Picker & Final Gate (rich, on-demand). The old synthetic
  // picker (renderTile6Picker) is the warming/error fallback so the slot is never
  // blank. NOTE: the original "Tile 4: Cost & Timing" tile was removed — its IV-
  // rank now lives in the picker's gate badge (per the Tile 4 build spec).
  const t4 = state.tile4Detail[row.ticker];
  const picker = (t4 && (t4.status === "ok" || t4.status === "stand_down"))
    ? renderTile4Picker(row, t4)
    : renderTile6Picker(row);
  return `
    ${renderFadeFlowBanner(row)}
    ${renderVerdictPanel(row)}
    <div class="tile" id="tile1-slot">${renderTile1Flow(row)}</div>
    <div class="tile" id="tile2-slot">${renderTile2OI(row)}</div>
    <div class="tile tile--wide" id="tile3-slot">${tile3}</div>
    <div class="tile tile-picker">${picker}</div>
  `;
}

/* Re-render ONLY Tile 3's slot from cache (weighting/expiry toggles are pure
 * client-side recompute — both already loaded in tile3Detail). Avoids nuking the
 * whole deep-dive (which reset scroll + collapsed open state). */
function _t3Rerender() {
  const row = ROWS.find(r => r.ticker === state.selected);
  const slot = document.getElementById("tile3-slot");
  if (!row || !slot) return;
  const detail = state.tile3Detail[row.ticker];
  slot.innerHTML = (detail && detail.status === "ok")
    ? renderTile3Rich(row, detail) : renderTile3Structural(row);
}

/* "You're fading the flow" — the single most useful contradiction on the screen.
 * Fires when the operator's CHOSEN side (row.direction, possibly toggled) opposes
 * the OBSERVED opening flow (row.tile2.flow_side, fixed at build). This is the
 * conflict the toggle must make louder, NOT launder away. Silent when the choice
 * agrees with the flow, or when there's no observed flow side (gamma-only). */
function renderFadeFlowBanner(row) {
  const obs = row.tile2 && row.tile2.flow_side;   // "call" | "put" | "" (none)
  if (!obs) return "";
  const chosen = row.direction === "puts" ? "put" : "call";
  if (chosen === obs) return "";
  const obsWord = obs === "call" ? "CALLS" : "PUTS";
  const chWord = chosen === "call" ? "CALLS" : "PUTS";
  const conf = row.tile2.confirmation;
  const oiBit = conf === "building" ? ` and ${obsWord.toLowerCase()}-side OI is building`
              : conf === "unwinding" ? ` (though that ${obsWord.toLowerCase()} OI is unwinding)` : "";
  return `<div class="fade-flow-warn">
    ⚠ You're set to <b>${chWord}</b>, but today's opening flow is on the <b>${obsWord}</b> side${oiBit}.
    You're <b>fading the flow</b> — treat this as a contradiction, not confirmation.
  </div>`;
}

/* Deep-dive 3-leg verdict (Plan 3). Positioning + Structural directional legs,
 * Skew visually SUBORDINATE (asymmetric oppose-veto — never a peer green), Cost as
 * a guard, a loud conflict banner, and an ACTION headline (the do-this). Light/grid
 * rows have no verdict → renders nothing. */
function renderVerdictPanel(row) {
  const v = row.verdict;
  if (!v) return "";
  const dot = c => `<span class="dot ${c}"></span>`;
  const conflict = v.signal_conflict
    ? `<div class="vd-conflict">⚠ Signals disagree (${(v.conflict_legs||[]).join(", ")}) — positioning says ${row.direction}</div>`
    : "";
  const actCls = v.overall === "Favorable" ? "ok" : v.overall === "Stand down" ? "neg" : "warn";
  return `
    <div class="verdict-panel">
      <div class="vd-action ${actCls}">${v.action} <span class="vd-overall">(${v.overall})</span></div>
      <div class="vd-legs">
        <span class="vd-leg">${dot(v.positioning)} Positioning</span>
        <span class="vd-leg">${dot(v.structural)} Structural</span>
        <span class="vd-leg vd-skew" title="25Δ risk-reversal (derived from ~30d greeks) — corroboration only, never a peer signal"><em>${v.skew}</em> skew</span>
        <span class="vd-leg vd-guard">cost: ${v.cost_guard}</span>
      </div>
      ${conflict}
    </div>`;
}

/* ============================================================
 * Task 8: Data-honesty pill helper
 * ============================================================ */

function pill(kind) {
  // kind: "live" | "cross" | "proxy"
  const map = {
    live:  {icon:"🔵", label:"LIVE",  tooltipKey:"pill_live"},
    cross: {icon:"📊", label:"CROSS", tooltipKey:"pill_cross"},
    proxy: {icon:"⚠️", label:"PROXY", tooltipKey:"pill_proxy"},
  };
  const m = map[kind];
  return `<span class="pill ${kind}" data-tooltip="${m.tooltipKey}"><span class="icon">${m.icon}</span>${m.label}</span>`;
}

/* ============================================================
 * Task 9: Tile 1 — Flow Conviction (SVG chart + 3-stat row)
 * ============================================================ */

/* Tile 1's HEADLINE conviction read: the opening call-vs-put premium balance —
 * the same net-opening signal that sets the verdict's direction (derive_direction),
 * and one that actually populates on the Basic tier (unlike ask-side). Both-sides,
 * observed — NOT filtered by the side toggle. Falls back to total flow when no
 * opening (volume/OI>1) prints exist, labeled honestly. */
/* Shared opening-flow premium split — the OBSERVED call/put balance (toggle-
 * independent: direction must not shift with the operator's side choice or the
 * min-$ slider). Both the verdict surface and its details read from this so every
 * figure agrees. Returns null when there's no single-leg flow to read. */
function _t1OpeningSplit(row) {
  let single = (row.flow_alerts_detail || []).filter(a => a.has_singleleg && !a.has_multileg);
  if (!single.length) return null;
  const tOf = a => Math.floor(new Date(a.created_at).getTime() / 1000);
  const epochs = [...single.map(tOf).filter(t => !isNaN(t)), ...(row.ohlc || []).map(b => b.t)];
  if (epochs.length) {
    const sess = _sessionBounds(Math.max(...epochs));
    const inSess = single.filter(a => { const t = tOf(a); return t >= sess.open && t <= sess.close; });
    if (inSess.length) single = inSess;
  }
  const opn = single.filter(a => (a.volume_oi_ratio || 0) > 1);
  const isOpening = opn.length > 0;
  const base = isOpening ? opn : single;
  const cP = base.filter(a => a.type === "call").reduce((s, a) => s + (a.total_premium || 0), 0);
  const pP = base.filter(a => a.type === "put").reduce((s, a) => s + (a.total_premium || 0), 0);
  const tot = cP + pP;
  if (tot <= 0) return null;
  const callPct = Math.round(cP / tot * 100);
  return {cP, pP, tot, totAll: single.reduce((s, a) => s + (a.total_premium || 0), 0),
          callPct, putPct: 100 - callPct, isOpening, callLead: callPct >= 50};
}

/* Conviction meter — a RE-PRESENTATION of existing signals (NO new logic): prefer
 * the greek-flow delta agreement (the same divergence test the delta box uses);
 * fall back to how lopsided the opening premium is when there's no delta read for
 * the name. Returns {dots 1-3, label, tone, sub}. */
function _t1Conviction(row, sp) {
  const gf = row.greek_flow;
  if (gf && gf.available) {
    const dir = gf.dir_delta || 0, total = gf.net_delta || 0;
    const dirBull = dir > 0, totalBull = total > 0;
    const chosenBull = row.direction !== "puts";
    const diverges = dir !== 0 && ((total !== 0 && dirBull !== totalBull) || dirBull !== chosenBull);
    if (diverges) return {dots: 1, label: "MIXED", tone: "warn", sub: "signals disagree"};
    const tone = (sp ? sp.callLead : dirBull) ? "ok" : "neg";
    if (gf.accumulation === "building") return {dots: 3, label: "STRONG", tone, sub: "signals agree"};
    if (gf.accumulation === "fading" || gf.accumulation === "reversed")
      return {dots: 1, label: "WEAK", tone: "warn", sub: "conviction fading"};
    return {dots: 2, label: "MODERATE", tone, sub: "signals mostly agree"};
  }
  // No delta read — judge only by how one-sided the premium is (honest caveat).
  const imb = sp ? Math.abs(sp.callPct - 50) : 0;
  const tone = sp && sp.callLead ? "ok" : "neg";
  if (imb >= 25) return {dots: 2, label: "CLEAR LEAN", tone, sub: "by premium only"};
  if (imb >= 12) return {dots: 1, label: "SLIGHT LEAN", tone, sub: "by premium only"};
  return {dots: 1, label: "MIXED", tone: "warn", sub: "fairly balanced"};
}

/* Tile 1 VERDICT (surface) — answer-before-evidence: a glanceable direction word +
 * a 3-dot conviction meter + the up/down bar + ONE number ("new bets"). Every
 * secondary number, the call/put split, the "opening" explanation, the shown/ask
 * stats, and the delta graph all live behind the "details" tap. */
function renderT1Verdict(row) {
  const sp = _t1OpeningSplit(row);
  if (!sp) return "";
  const conv = _t1Conviction(row, sp);
  const fmtP = p => p >= 1e6 ? `$${(p / 1e6).toFixed(1)}M` : `$${Math.round(p / 1e3)}k`;
  const bull = sp.callLead;
  const dirWord = bull ? "BETTING UP" : "BETTING DOWN";
  const arrow = bull ? "↑" : "↓";
  const dirCol = bull ? "var(--ok)" : "var(--neg)";
  const meter = [0, 1, 2].map(i => `<span class="t1v-dot ${i < conv.dots ? "lit " + conv.tone : ""}"></span>`).join("");
  const bar = `<div class="t1v-bar">
      <div class="t1v-up" style="width:${sp.callPct}%">${sp.callPct >= 14 ? sp.callPct + "%" : ""}</div>
      <div class="t1v-dn" style="width:${sp.putPct}%">${sp.putPct >= 14 ? sp.putPct + "%" : ""}</div>
    </div>`;
  const details = `<details class="t1v-details"><summary>details</summary>
      <div class="t1v-detail-body">
        <div class="t1v-dl"><span>New bets (opening)</span><span><b class="call">${fmtP(sp.cP)}</b> up · <b class="put">${fmtP(sp.pP)}</b> down</span></div>
        <div class="t1v-dl"><span>All flow this session</span><span>${fmtP(sp.totAll)}</span></div>
        <div class="t1v-dl-note">“new bets” = positions being <em>opened</em> today (volume &gt; existing open interest), not closing out old ones.</div>
        <div id="t1-stats" class="t1v-stats">${renderT1StatsRow(row)}</div>
        ${renderT1DeltaDetail(row)}
      </div>
    </details>`;
  return `<div class="t1-verdict">
      <div class="t1v-top">
        <span class="t1v-dir" style="color:${dirCol}">${arrow} ${dirWord}</span>
        <span class="t1v-conv ${conv.tone}">${conv.label}<span class="t1v-meter">${meter}</span></span>
      </div>
      ${bar}
      <div class="t1v-sub"><b>${fmtP(sp.tot)}</b> new bets · ${conv.sub}</div>
      ${details}
    </div>`;
}

/* Net-delta composite (spec 2026-06-06-tile1-greek-flow-delta, rev 5). LEAD =
 * dir_delta (directional single-leg bets, the strategy-relevant read); net_delta
 * (total_delta_flow, all flow incl. hedges) is the secondary cross-read. The
 * directional SIGN is not independently validated, so the headline leads cautiously
 * and STANDS DOWN on divergence — when the directional bets disagree with the
 * broader tape or the premium lean, it surfaces the disagreement instead of a
 * confident call. Deep-dive only; nothing when unavailable (no fabricated curve). */
function _t1DeltaSpark(cum, net) {
  if (!cum || cum.length < 2) return "";
  const W = 140, H = 26, pad = 2;
  const lo = Math.min(...cum, 0), hi = Math.max(...cum, 0), range = (hi - lo) || 1;
  const x = i => pad + (W - 2 * pad) * (i / (cum.length - 1));
  const y = v => pad + (H - 2 * pad) * (1 - (v - lo) / range);
  const pts = cum.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const col = net >= 0 ? "#9ECE6A" : "#F7768E";
  return `<svg class="t1d-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:104px;height:22px;display:block;">
    <line x1="${pad}" y1="${y(0).toFixed(1)}" x2="${W - pad}" y2="${y(0).toFixed(1)}" stroke="var(--grid)" stroke-width="0.5"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.4"/></svg>`;
}
/* Delta-flow DETAIL (shown inside the verdict's "details" tap). The conviction it
 * feeds (agree/disagree) is already surfaced as the verdict meter; here we show the
 * evidence: a LABELLED running-total graph (grammar established once — "above the
 * line = net up") + the two plain delta reads. Nothing when unavailable. */
function renderT1DeltaDetail(row) {
  const gf = row.greek_flow;
  if (!gf || !gf.available) return "";
  const fmtSh = n => { const a = Math.abs(n); return a >= 1e9 ? `${(a / 1e9).toFixed(1)}B` : a >= 1e6 ? `${(a / 1e6).toFixed(0)}M` : a >= 1e3 ? `${Math.round(a / 1e3)}k` : `${Math.round(a)}`; };
  const dir = gf.dir_delta || 0, total = gf.net_delta || 0;
  const spark = _t1DeltaSpark(gf.cumsum, dir);
  const accLine = {
    building: "built steadily one way — some conviction",
    fading:   "spiked, then drifted back toward flat",
    reversed: "flipped to the other side late",
    choppy:   "wandered up and down — no steady conviction",
    flat:     "barely moved",
  }[gf.accumulation || ""] || "tracks those bets through the day";
  const prov = gf.provisional ? ` · <span class="t1d-prov">provisional, early session</span>` : "";
  return `<div class="t1v-delta">
    <div class="t1v-delta-h">Delta flow <span class="t1d-what">· who’s betting on direction</span></div>
    <div class="t1v-graphrow">${spark}<span class="t1v-glos"><b>above</b> the line = net up, below = net down — here it ${accLine}${prov}</span></div>
    <div class="t1v-nums">clear directional bets ≈${fmtSh(dir)} sh ${dir > 0 ? "up" : "down"} · all-flow incl. hedges ≈${fmtSh(total)} sh ${total > 0 ? "up" : "down"}
      <span class="t1d-note">“all-flow” counts hedges &amp; spreads too — that’s why the two can point opposite ways.</span></div>
  </div>`;
}

/* Stamp the FLOW's actual time window (not "session") so it's honest about
 * coverage. The flow-alerts feed returns only the last N alerts, so on an active
 * name (SPY) the window is just the tail of the day — flag that explicitly rather
 * than implying full-session coverage. */
function _t1SessionStamp(row) {
  const at = (row.flow_alerts_detail || [])
    .map(a => new Date(a.created_at).getTime()).filter(t => !isNaN(t));
  if (!at.length) return "";
  const lo = Math.min(...at), hi = Math.max(...at);
  const fmtD = t => new Date(t).toLocaleDateString("en-US", {timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric"});
  const fmtT = t => new Date(t).toLocaleTimeString("en-US", {timeZone: "America/New_York", hour: "numeric", minute: "2-digit"});
  // Earliest flow well after the 9:30 open ⇒ the feed returned only the tail (cap hit).
  const sessOpen = _sessionOpenEpoch(Math.floor(hi / 1000)) * 1000;
  const truncated = lo > sessOpen + 45 * 60 * 1000;
  return `flow ${fmtD(hi)} ${fmtT(lo)}–${fmtT(hi)} ET${truncated ? ` · <span class="flow-trunc">last alerts only — not full session</span>` : ""}`;
}

/* The "shown" stat row — the side + min-$ filtered subset that's actually on the
 * chart. Re-rendered on its own when the min-$ slider moves (so it never goes stale
 * against the slider). A DIFFERENT scope than the balance's "session flow". */
function renderT1StatsRow(row) {
  let nAlerts, totalPrem, askPct, minK = 0;
  if (row.is_light) {
    const fd = row.flow || {alerts: 0, premium_usd: 0};
    nAlerts = fd.alerts || 0; totalPrem = fd.premium_usd || 0;
    askPct = (row.ask_side_pct || 0) * 100;
  } else {
    const vis = _t1Resolve(row);
    nAlerts = vis.alerts.length;
    totalPrem = vis.alerts.reduce((s, a) => s + (a.total_premium || 0), 0);
    const ask = vis.alerts.reduce((s, a) => s + (a.total_ask_side_prem || 0), 0);
    const bid = vis.alerts.reduce((s, a) => s + (a.total_bid_side_prem || 0), 0);
    askPct = (ask + bid) > 0 ? ask / (ask + bid) * 100 : 0;
    minK = _t1EffMinK(row);
  }
  const premLabel = totalPrem >= 1e6 ? `$${(totalPrem / 1e6).toFixed(1)}M` : `$${Math.round(totalPrem / 1e3)}k`;
  const askPopulated = askPct > 0 && nAlerts > 0;
  const askColor = askPct >= 75 ? "var(--ok)" : "var(--text)";
  const askStat = askPopulated ? `
      <div class="flow-stat"><span class="lbl">Ask-side %</span>
        <span class="val" style="color:${askColor}">${askPct.toFixed(0)}%</span></div>` : "";
  const sideF = (state.t1Side && state.t1Side !== "all") ? state.t1Side + ", " : "";
  const shownNote = (!row.is_light && (minK > 0 || sideF))
    ? ` <span class="flow-stat-scope">(${sideF}${minK > 0 ? "≥" + _fmtK(minK) : "all sizes"})</span>` : "";
  return `
      <div class="flow-stat"><span class="lbl">Alerts (shown)</span><span class="val">${nAlerts}</span></div>
      <div class="flow-stat"><span class="lbl">Shown $${shownNote}</span><span class="val">${premLabel}</span></div>
      ${askStat}`;
}

function renderTile1Flow(row) {
  const g = row.gates.flow;
  const stamp = _t1SessionStamp(row);
  return `
    <h3>
      <span><span class="gate-dot ${g}"></span>What big money's betting</span>
      <button class="help-icon" data-help="tile1">?</button>
    </h3>
    ${renderT1Verdict(row)}
    ${stamp ? `<div class="flow-asof">${stamp}</div>` : ""}
    <div class="flow-legend-row">
      <span class="legend-item"><span class="legend-swatch call"></span>betting up</span>
      <span class="legend-item"><span class="legend-swatch put"></span>betting down</span>
      <span class="legend-item">bigger = more $</span>
    </div>
    ${row.is_light ? `
    <div class="flow-chart-wrap" id="t1-chart">
      <div class="flow-empty">Building full flow + price chart…</div>
    </div>` : `
    ${renderT1Controls(row)}
    <div class="flow-chart-wrap" id="t1-chart">
      ${renderFlowChart(row)}
    </div>
    <div class="flow-alert-detail" data-empty="true">Tap a bubble for trade detail</div>
    ${renderT1TopFlows(row)}
    ${renderT1Synthesis(row)}`}
  `;
}

/* Top 5 flows in the currently-shown pool (respects the side toggle + min-$ floor,
 * so it tracks the chart). Biggest premium first — the trades actually moving the
 * read. */
function renderT1TopFlows(row) {
  const { alerts } = _t1Resolve(row);
  if (!alerts.length) return "";
  const top = alerts.slice().sort((a, b) => b.total_premium - a.total_premium).slice(0, 5);
  const fmtP = p => p >= 1e6 ? `$${(p / 1e6).toFixed(1)}M` : `$${Math.round(p / 1e3)}k`;
  const et = ts => new Date(ts).toLocaleTimeString("en-US", {timeZone: "America/New_York", hour: "numeric", minute: "2-digit"});
  const rows = top.map(a => {
    const bull = a.type === "call";
    // Plain row: time · $premium · ↑/↓ $strike call/put · exp. The ×size / at-ask /
    // opening jargon moves to the bubble-tap detail + the help glossary.
    return `<tr>
      <td class="t1tf-t">${et(a.created_at)}</td>
      <td class="t1tf-desc"><b class="t1tf-prem ${a.type}">${fmtP(a.total_premium)}</b>
        <span class="t1tf-side ${a.type}">${bull ? "↑" : "↓"} $${(+a.strike).toLocaleString()} ${bull ? "call" : "put"}</span>
        <span class="t1tf-exp">· exp ${a.expiry || "?"}</span></td>
    </tr>`;
  }).join("");
  const sideLbl = state.t1Side === "calls" ? "up bets" : state.t1Side === "puts" ? "down bets" : "all";
  return `
    <div class="t1-topflows">
      <div class="t1tf-head">Biggest ${top.length} bets <span class="t1tf-sub">(${sideLbl})</span></div>
      <table class="t1tf-table">${rows}</table>
    </div>`;
}

/* Gemini synthesis of the OBSERVED flow (row.insights.flow). Anchored to what the
 * market did — does NOT follow the operator's direction toggle, so it stays an
 * honest read of the chart rather than echoing your chosen side. */
function renderT1Synthesis(row) {
  const text = row.insights && row.insights.flow;
  if (!text) return "";
  return `
    <div class="t1-synth">
      <span class="t1-synth-tag">✦ flow read</span>
      <span class="t1-synth-body">${text}</span>
    </div>`;
}

/* Tile 1 interactive controls: side filter (All/Calls/Puts — actually filters the
 * bubbles), a min-$ premium slider, and a timeframe window. All re-render only the
 * chart (so dragging the slider doesn't rebuild/lose the slider). */
function _t1MaxK(row) {
  const prem = (row.flow_alerts_detail || [])
    .filter(a => a.has_singleleg && !a.has_multileg)
    .map(a => a.total_premium || 0);
  const max = prem.length ? Math.max(...prem) : 0;
  return Math.max(500, Math.ceil(max / 1000 / 50) * 50);   // $k, rounded up to 50, min 500
}
function _fmtK(k) {
  return k >= 1000 ? `$${(k / 1000).toFixed(k % 1000 ? 1 : 0)}M` : `$${k}k`;
}
// Per-ticker relative noise floor for Tile 1: hide the small-alert tail so a
// heavily-traded name doesn't spam tiny prints, while a quiet name still shows
// everything. Uses the 40th percentile of THIS ticker's own single-leg alert
// premiums (so it scales per ticker, not an absolute $). Only kicks in when the
// flow is actually busy (≥12 alerts); otherwise show all. Returns $k (slider step).
function _t1AutoMinK(row) {
  const prem = (row.flow_alerts_detail || [])
    .filter(a => a.has_singleleg && !a.has_multileg)
    .map(a => a.total_premium || 0).sort((a, b) => a - b);
  if (prem.length < 12) return 0;
  const p = prem[Math.floor(prem.length * 0.40)];
  return Math.round(p / 1000 / 50) * 50;
}
// Effective floor: explicit user value if set (incl. 0 = show all), else auto.
function _t1EffMinK(row) {
  return state.t1MinK == null ? _t1AutoMinK(row) : state.t1MinK;
}
// Single source of truth for what Tile 1 SHOWS: applies the side filter + min-$
// floor, confines to the newest extended trading day, and returns the visible
// alerts/ohlc plus the time axis. Both the chart and the header stats use this
// so the Alerts / Total premium / Ask-side % numbers always match what's plotted
// (and update with the toggle/slider). `empty` = nothing to draw.
function _t1Resolve(row) {
  const minPrem = _t1EffMinK(row) * 1000;
  const sideF = state.t1Side || "all";
  const sideWant = sideF === "puts" ? "put" : sideF === "calls" ? "call" : null;
  const ohlcAll = row.ohlc || [];
  const alertsAll = (row.flow_alerts_detail || []).filter(a =>
    a.has_singleleg && !a.has_multileg &&
    (a.total_premium || 0) >= minPrem &&
    (sideWant === null || a.type === sideWant));
  const tOf = a => Math.floor(new Date(a.created_at).getTime() / 1000);
  const rawT = [...alertsAll.map(tOf).filter(t => !isNaN(t)), ...ohlcAll.map(b => b.t)];
  if (alertsAll.length === 0 && ohlcAll.length === 0) {
    return {alerts: [], ohlc: [], tMin: 0, tMax: 1, empty: true};
  }
  const anchor = rawT.length ? Math.max(...rawT) : Math.floor(Date.now() / 1000);
  const sess = _sessionBounds(anchor);
  const inSess = t => t >= sess.open && t <= sess.close;
  let alerts = alertsAll.filter(a => inSess(tOf(a)));
  let ohlc = ohlcAll.filter(b => inSess(b.t));
  let spanT = [...alerts.map(tOf), ...ohlc.map(b => b.t)];
  if (spanT.length === 0) { alerts = alertsAll; ohlc = ohlcAll; spanT = rawT; }   // safety
  let tMin = Math.min(...spanT), tMax = Math.max(...spanT);
  if (!(tMax > tMin)) { tMin = anchor - 3600; tMax = anchor; }
  return {alerts, ohlc, tMin, tMax, empty: false};
}
// Epoch (sec) of 9:30 AM ET on the ET-calendar date of `epochSec`. DST-safe:
// derives the ET↔UTC offset from the anchor itself rather than assuming -4/-5.
function _etOffsetMs(ms) {
  const d = new Date(ms);
  const utc = new Date(d.toLocaleString("en-US", {timeZone: "UTC"}));
  const et = new Date(d.toLocaleString("en-US", {timeZone: "America/New_York"}));
  return et - utc;   // e.g. -4h in EDT, -5h in EST
}
function _sessionOpenEpoch(epochSec) {
  const ms = epochSec * 1000;
  const off = _etOffsetMs(ms);
  const DAY = 86400000;
  const etMidnight = Math.floor((ms + off) / DAY) * DAY - off;   // 00:00 ET as epoch ms
  return Math.floor((etMidnight + (9 * 60 + 30) * 60000) / 1000);
}
// "Nice" axis step: round 1/2/5×10ⁿ value giving ~`target` intervals over `range`,
// so tick labels land on round numbers ($95, $100, $105) not arbitrary fractions.
function _niceStep(range, target) {
  if (!(range > 0)) return 1;
  const raw = range / target;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  return (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
}
// X-axis ticks on round ET clock hours within [tMin, tMax]. Step widens (1h→2h→3h)
// as the visible span grows so labels stay readable.
function _hourTicks(tMin, tMax) {
  const hours = (tMax - tMin) / 3600;
  const stepH = hours <= 5 ? 1 : hours <= 10 ? 2 : 3;
  const stepS = stepH * 3600;
  const off = _etOffsetMs(tMin * 1000) / 1000;       // ET wall = epoch + off (off<0)
  const first = Math.ceil((tMin + off) / stepS) * stepS - off;   // first ET-hour boundary ≥ tMin
  const out = [];
  for (let t = first; t <= tMax; t += stepS) out.push(t);
  return out;
}
// EXTENDED trading day [4:00, 20:00] ET around `epochSec` (pre-market through
// after-hours). The chart confines to ONE such day so it never spans an
// overnight gap; the visible axis then tightens to the data actually present.
function _sessionBounds(epochSec) {
  const open = _sessionOpenEpoch(epochSec);              // 9:30 ET
  return {open: open - Math.round(5.5 * 3600),           // 04:00 ET (pre-market open)
          close: open + Math.round(10.5 * 3600)};        // 20:00 ET (after-hours close)
}
function renderT1Controls(row) {
  const maxK = _t1MaxK(row);
  const seg = (val, cur, label, fn) =>
    `<button class="t3-tog ${val === cur ? "on" : ""}" onclick="${fn}('${val}')">${label}</button>`;
  return `
    <div class="t1-controls">
      <div class="t3-grp"><span class="t3-grp-l">Side</span>
        ${seg("all", state.t1Side, "All", "setT1Side")}${seg("calls", state.t1Side, "Calls", "setT1Side")}${seg("puts", state.t1Side, "Puts", "setT1Side")}</div>
      <div class="t3-grp t1-minwrap"><span class="t3-grp-l">Hide&nbsp;under</span>
        <input type="range" id="t1-min" class="t1-slider" min="0" max="${maxK}" step="50"
               value="${Math.min(_t1EffMinK(row), maxK)}" oninput="onT1Min(this.value)">
        <span class="t1-min-lbl" id="t1-min-lbl">${_t1MinLabel(row)}</span></div>
    </div>`;
}
// Label for the Min-$ slider: "auto · ≥ $Xk" when on the per-ticker floor,
// "all" when at 0, explicit "≥ $Xk" once the user drags it.
function _t1MinLabel(row) {
  const eff = _t1EffMinK(row);
  if (!eff) return "showing all";
  return (state.t1MinK == null ? "auto: under " : "under ") + _fmtK(eff);
}
// Re-render ONLY Tile 1's slot (controls + chart). Scoped so a sibling tile that
// errors on incomplete data can't abort the whole deep-dive render — which made
// the side toggle look dead (one throw in renderDeepDive killed the innerHTML set).
function _t1RerenderTile() {
  const row = ROWS.find(r => r.ticker === state.selected);
  const slot = document.getElementById("tile1-slot");
  if (row && slot) slot.innerHTML = renderTile1Flow(row);
}
function _t1Rerender() {
  const row = ROWS.find(r => r.ticker === state.selected);
  const slot = document.getElementById("t1-chart");
  if (row && slot) slot.innerHTML = renderFlowChart(row);
}
function setT1Side(s) { state.t1Side = s; _t1RerenderTile(); }   // slot-scoped: updates 'on' + bubbles
function onT1Min(v) {
  state.t1MinK = +v;
  const lbl = document.getElementById("t1-min-lbl");
  if (lbl) lbl.textContent = state.t1MinK ? "under " + _fmtK(state.t1MinK) : "showing all";
  _t1Rerender();   // chart only — keep the slider element intact mid-drag
  // Also refresh the SHOWN $ stat row so it never goes stale vs the slider (it's
  // a separate element from the slider, so this doesn't interrupt the drag).
  const row = ROWS.find(r => r.ticker === state.selected);
  const stats = document.getElementById("t1-stats");
  if (row && stats) stats.innerHTML = renderT1StatsRow(row);
}

/* Tile 1 chart per the build spec: scatter of single-leg alert bubbles plotted
 * over the underlying OHLC price line.
 *   x = time (ET, last extended trading day: pre-market → after-hours)
 *   y = price ($, padded to fit lowest put strike and highest call strike + line)
 *   bubble area ∝ sqrt(total_premium / 600), capped at r=22
 *   color = type (call=green / put=red)
 *   fill = ask-dominant solid / bid-dominant hollow
 *   ring = has_sweep
 * Multileg excluded; UTC→ET conversion applied. */
function renderFlowChart(row) {
  // viewBox matches the visual aspect we want on phone (320×200 ≈ 1.6:1)
  // and uses default preserveAspectRatio (xMidYMid meet) so circles stay
  // circular regardless of rendered container width. height:auto lets the
  // SVG match its natural aspect — no letterboxing.
  const W = 320, H = 200;
  const padL = 40, padR = 12, padT = 10, padB = 22;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const spot = row.spot || 0;

  const { alerts, ohlc, tMin, tMax, empty } = _t1Resolve(row);
  if (empty) {
    return `<div class="flow-empty">No live alerts or OHLC for this ticker yet — first cycle still warming.</div>`;
  }
  const xForT = t => padL + innerW * Math.max(0, Math.min(1, (t - tMin) / (tMax - tMin || 1)));

  // ---- Y domain: spans alert strikes + ohlc price range ----
  const strikes = alerts.map(a => a.strike).filter(s => s > 0);
  const prices = ohlc.flatMap(b => [b.h, b.l, b.c]).filter(p => p > 0);
  const seedRange = [spot * 0.97, spot * 1.03].filter(v => v > 0);
  const yPool = [...strikes, ...prices, ...seedRange, spot].filter(v => v > 0);
  let yLo = Math.min(...yPool);
  let yHi = Math.max(...yPool);
  const yPad = (yHi - yLo) * 0.06 || spot * 0.01 || 1;
  yLo -= yPad; yHi += yPad;
  const yForP = p => padT + innerH * (1 - (p - yLo) / (yHi - yLo || 1));

  // ---- Background grid + axes ----
  const axisBox = `
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + innerH}" stroke="var(--axis)" stroke-width="0.8"/>
    <line x1="${padL}" y1="${padT + innerH}" x2="${padL + innerW}" y2="${padT + innerH}" stroke="var(--axis)" stroke-width="0.8"/>
  `;

  // ---- Y ticks: ROUND price levels (nice step), not arbitrary fractions ----
  const fmt = p => p < 10 ? p.toFixed(2) : p < 100 ? p.toFixed(1) : Math.round(p).toString();
  const yStep = _niceStep(yHi - yLo, 5);
  let yTicksSvg = "";
  for (let p = Math.ceil(yLo / yStep) * yStep; p <= yHi + 1e-9; p += yStep) {
    const y = yForP(p);
    yTicksSvg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${padL + innerW}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="0.4" opacity="0.5"/>`;
    yTicksSvg += `<text x="${padL - 4}" y="${(y + 3).toFixed(1)}" text-anchor="end" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9">$${fmt(p)}</text>`;
  }

  // ---- X ticks: on round ET clock hours (10:00, 11:00 …), not arbitrary slices ----
  const fmtET = epoch =>
    new Date(epoch * 1000).toLocaleTimeString("en-US", {timeZone: "America/New_York", hour: "numeric", minute: "2-digit"});
  let xTicksSvg = "";
  for (const t of _hourTicks(tMin, tMax)) {
    const x = xForT(t);
    xTicksSvg += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${padT + innerH}" stroke="var(--grid)" stroke-width="0.4" opacity="0.35"/>`;
    xTicksSvg += `<text x="${x.toFixed(1)}" y="${(padT + innerH + 14).toFixed(1)}" text-anchor="middle" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9">${fmtET(t)}</text>`;
  }

  // ---- OHLC price line (close-of-bar). Brighter than the axis so it reads as
  // the price track, not chart furniture. Single point → a dot so a 1-bar
  // session still shows price. ----
  let priceLine = "";
  if (ohlc.length >= 2) {
    const sorted = ohlc.slice().sort((a, b) => a.t - b.t);
    const pts = sorted.map(b => `${xForT(b.t).toFixed(1)},${yForP(b.c).toFixed(1)}`).join(" ");
    priceLine = `<polyline points="${pts}" fill="none" stroke="var(--text)" stroke-width="1.5" opacity="0.95"/>`;
  } else if (ohlc.length === 1) {
    priceLine = `<circle cx="${xForT(ohlc[0].t).toFixed(1)}" cy="${yForP(ohlc[0].c).toFixed(1)}" r="1.6" fill="var(--text)"/>`;
  }

  // ---- Spot reference (dashed horizontal at row.spot) ----
  const spotY = yForP(spot);
  const spotLine = `<line x1="${padL}" y1="${spotY.toFixed(1)}" x2="${padL + innerW}" y2="${spotY.toFixed(1)}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="4,4" opacity="0.55"/>`;
  const spotLabel = `<text x="${(padL + innerW - 2).toFixed(1)}" y="${(spotY - 4).toFixed(1)}" text-anchor="end" fill="var(--warn)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9" font-weight="700">now $${fmt(spot)}</text>`;

  // ---- Alert bubbles ----
  // Size: log-based, recalibrated for the 320-unit-wide viewBox so even the
  // biggest bubble is only ~4% of chart width. r is in SVG units (which now
  // map 1:1 to circular pixels since viewBox aspect = container aspect).
  // r = clamp(3 + 2 * log10(premium / 50000), 3, 12)
  //   $50k = 3 (floor)  · $200k = 4.2  · $1M = 5.6  · $10M = 7  · $100M = 11
  // Sort biggest-first so smaller bubbles render on top and remain clickable.
  let bubblesSvg = "";
  const sortedAlerts = alerts.slice().sort((a, b) => b.total_premium - a.total_premium);
  // ask/bid populated check — spec hard-constraint #5 fallback: if every alert
  // has empty ask/bid premium, drop the solid/hollow distinction and color
  // by type only (everything solid). Aggregate signal stays in header strip.
  const askBidPopulated = alerts.some(a => (a.total_ask_side_prem + a.total_bid_side_prem) > 0);
  for (const a of sortedAlerts) {
    const epoch = Math.floor(new Date(a.created_at).getTime() / 1000);
    if (isNaN(epoch) || epoch < tMin) continue;
    const cx = xForT(epoch);
    const cy = yForP(a.strike);
    const prem = Math.max(1, a.total_premium);
    const r = Math.min(12, Math.max(3, 3 + 2 * Math.log10(prem / 50000)));
    const color = a.type === "call" ? "#639922" : "#E24B4A";
    const askBidSum = a.total_ask_side_prem + a.total_bid_side_prem;
    const askDom = askBidSum > 0 ? (a.total_ask_side_prem / askBidSum) >= 0.5 : true;
    // Surface = 2 dimensions only (color = up/down, size = $). The sold-vs-bought
    // (fill) and swept (ring) nuances are kept in the tap detail below, not on the
    // glanceable chart — a novice reads direction + size, details on tap.
    const fill = color;
    const strokeW = 1.4;
    const ring = "";
    const tET = fmtET(epoch);
    const premLbl = a.total_premium >= 1e6 ? `$${(a.total_premium / 1e6).toFixed(1)}M` : `$${Math.round(a.total_premium / 1e3)}k`;
    const askPctAlert = askBidSum > 0 ? Math.round((a.total_ask_side_prem / askBidSum) * 100) : null;
    const sideLbl = askPctAlert == null ? "ask/bid n/a"
                                         : `${askPctAlert}% ${askDom ? "bought at ask" : "sold at bid"}`;
    const isOpening = a.all_opening_trades || (a.volume_oi_ratio || 0) > 1;   // vol/OI>1 proxy (real flag dead on Basic)
    const hover = `${tET} — ${a.total_size} contracts of the $${fmt(a.strike)} ${a.type} exp ${a.expiry || "?"} · ${premLbl} · ${sideLbl}${a.has_sweep ? " · swept" : ""}${isOpening ? " · opening" : ""}`;
    const dataHover = hover.replace(/"/g, "&quot;").replace(/&/g, "&amp;").replace(/</g, "&lt;");
    bubblesSvg += `${ring}<circle class="flow-bubble" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${fill}" stroke="${color}" stroke-width="${strokeW}" opacity="0.92" data-hover="${dataHover}"/>`;
  }

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;max-height:280px;">
      ${yTicksSvg}
      ${axisBox}
      ${priceLine}
      ${spotLine}
      ${spotLabel}
      ${bubblesSvg}
      ${xTicksSvg}
      <text x="${(padL + innerW / 2).toFixed(1)}" y="${(H - 2).toFixed(1)}" text-anchor="middle" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="7">time (ET, last session incl. pre/post)</text>
    </svg>
  `;
}

/* ============================================================
 * Task 10: Tile 2 — Positioning Reality Check (tile2_build_spec.md)
 * Is the flow real, is OI building, what expiry holds it, still held?
 * ============================================================ */

function renderTile2OI(row) {
  const g = row.gates.oi;
  const t2 = row.tile2 || {};
  const head = `
    <h3>
      <span><span class="gate-dot ${g}"></span>Tile 2: Positioning Reality Check</span>
      <button class="help-icon" data-help="tile2">?</button>
    </h3>`;

  const strikes = t2.strikes || [];   // each: {strike, side, expiry, premium_usd, sessions, ...}
  if (strikes.length === 0) {
    return `${head}
      <div class="t2-empty">No opening-flow strikes for ${row.ticker} yet.</div>`;
  }

  // Which side's AGGREGATE bars + per-strike to view. Defaults to the flow side;
  // tapping a cluster card switches it. Navigation only — both verdicts stay in
  // the cards, so this never changes the read (observed evidence).
  let viewSide = state.t2ViewSide || t2.flow_side || strikes[0].side || "call";
  // Never resolve to a side with no flow-hit strikes (nothing to view there).
  if (!strikes.some(s => s.side === viewSide)) viewSide = (strikes[0] || {}).side || viewSide;
  const aggSessions = viewSide === "call" ? (t2.call_sessions || []) : (t2.put_sessions || []);
  const viewConf = viewSide === "call" ? t2.call_confirmation : t2.put_confirmation;
  const viewIsContext = viewSide === "call" ? t2.call_is_context : t2.put_is_context;
  const viewStrikes = strikes.filter(s => s.side === viewSide);
  // Optional drill-down: a strike the user TAPPED to expand (within the viewed side).
  const sel = state.t2Strike != null ? viewStrikes.find(s => s.strike === state.t2Strike) : null;
  const sess = t2.sessions_available || 0;
  const viewWord = viewSide === "call" ? "Calls" : "Puts";
  const otherWord = viewSide === "call" ? "put" : "call";

  return `${head}
    ${renderT2SettleBadge(t2)}
    ${renderT2ClusterCards(t2, viewSide)}
    <div class="t2-agg">
      <div class="t2-agg-title">${viewIsContext
          ? `${viewWord} OI @ ${otherWord}-flow strikes (context) · last ${sess} settled session${sess === 1 ? "" : "s"}`
          : `${viewWord} cluster — aggregate OI · last ${sess} settled session${sess === 1 ? "" : "s"}`}</div>
      ${viewIsContext ? `<div class="t2-context-note">No ${viewWord.toLowerCase()} flow opened this session — showing ${viewWord.toLowerCase()} <b>settled OI</b> at the ${otherWord}-flow strikes, for comparison. This is context, <b>not</b> a confirmation.</div>` : ""}
      ${renderT2AggBars(aggSessions, viewIsContext ? "context" : viewConf,
          viewStrikes.length === 0
            ? `no opening ${viewSide === "call" ? "call" : "put"} flow this session — nothing to confirm`
            : viewStrikes.filter(s => s.in_aggregate).length === 0
              ? `all ${viewSide === "call" ? "call" : "put"} flow is far-dated — nothing near-term to confirm`
              : `bars fill over the trading week (${sess}/2 settled session${sess === 1 ? "" : "s"})`)}
    </div>
    <div class="t2-minis-wrap">
      <div class="t2-minis-title">By strike <span class="t2-minis-hint">(tap to expand)</span></div>
      ${renderT2StrikeMinis(viewStrikes)}
      ${sel ? renderOiSingleStrike(sel) : ""}
    </div>
    ${renderT2ExpiryRelevance(t2)}
    ${renderT2Synthesis(row)}`;
}

/* Headline: BOTH side clusters, ALWAYS shown — the call-vs-put comparison IS the
 * signal, so the operator's direction toggle never changes it (observed evidence).
 * Each aggregates that side's flow-hit strike cluster (5-session OI trend). */
/* FORMING vs SETTLED mode badge. Keyed to the TRADING calendar (server-computed),
 * never calendar "today": a weekend/holiday is never a forming session. FORMING =
 * the flow's trading session whose OI hasn't published yet → it confirms ~9:15am ET
 * the NEXT trading day (settles_on). SETTLED = it landed as a bar (final). */
function _t2FmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00Z");
  return isNaN(d) ? iso : d.toLocaleDateString("en-US", {timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric"});
}
function renderT2SettleBadge(t2) {
  if (t2.settlement_mode === "forming") {
    const d = _t2FmtDate(t2.forming_date);
    const on = _t2FmtDate(t2.settles_on);
    return `<div class="t2-settle forming">● FORMING${d ? " · " + d + " flow" : ""} — OI not yet published
      <span class="t2-settle-sub">${on ? "confirms " + on + " ~9:15am ET" : "confirms ~9:15am ET next trading day"}</span></div>`;
  }
  const d = _t2FmtDate(t2.settled_through);
  return `<div class="t2-settle settled">● SETTLED${d ? " · confirms " + d : ""}
    <span class="t2-settle-sub">OI published — bars are final</span></div>`;
}

function renderT2ClusterCards(t2, viewSide) {
  const map = {
    building:    {t: "Building",  c: "var(--ok)",   d: "green",  a: "↑"},
    unwinding:   {t: "Unwinding", c: "var(--neg)",  d: "red",    a: "↓"},
    flat:        {t: "Flat",      c: "var(--axis)", d: "yellow", a: "→"},
  };
  const strikes = t2.strikes || [];
  const sess = t2.sessions_available || 0;
  const card = (side) => {
    const conf = side === "call" ? t2.call_confirmation : t2.put_confirmation;
    const pct = (side === "call" ? t2.call_oi_trend_pct : t2.put_oi_trend_pct) || 0;
    const isContext = side === "call" ? t2.call_is_context : t2.put_is_context;
    const other = side === "call" ? "put" : "call";
    const sideStrikes = strikes.filter(s => s.side === side);
    const total = sideStrikes.length;                          // strikes shown (flow or context)
    const inAgg = sideStrikes.filter(s => s.in_aggregate).length;  // near-dated (≤14 DTE) cluster
    const isFlow = t2.flow_side === side;
    const noFlow = total === 0;          // no flow AND no context to show
    const farOnly = total > 0 && inAgg === 0 && !isContext;  // flow exists but all far-dated
    let m, sub;
    if (isContext) {
      // Settled OI shown for a side that had NO opening flow — context, not a bet.
      m = {t: "Context", c: "var(--text-dim)", d: "gray", a: "·"};
      sub = `${side} OI at the ${total} ${other}-flow strike${total === 1 ? "" : "s"} · ${pct >= 0 ? "+" : ""}${Math.round(pct)}%`;
    } else if (farOnly) {
      // Flow is all far-dated (monthly/LEAP) — a weekly tool can't confirm a
      // near-term bet on it, so we DON'T (no fallback). Honest "can't verify".
      m = {t: "Far-dated", c: "var(--axis)", d: "gray", a: "·"};
      sub = `all flow far-dated — nothing near-term to confirm`;
    } else if (conf === "unconfirmed") {
      // "unconfirmed" has TWO distinct causes — never collapse them into "warming".
      if (noFlow) {
        m = {t: "No flow", c: "var(--axis)", d: "gray", a: "·"};
        sub = "no opening flow on this side";
      } else {
        m = {t: "Pending", c: "var(--warn)", d: "yellow", a: "·"};
        sub = `awaiting settled OI · ${sess}/2 sessions`;
      }
    } else {
      m = map[conf];
      // Honest breadth: the % is the NEAR-DATED cluster only. Say so when the flow
      // also hit far-dated strikes (LEAPS) that aren't in the number.
      const breadth = inAgg < total
        ? `${inAgg} of ${total} strikes near-dated`
        : `${total} strike${total === 1 ? "" : "s"}`;
      sub = `${pct >= 0 ? "+" : ""}${pct.toFixed(0)}% OI · ${breadth}`;
    }
    // Clickable when there's something to view (a flow cluster OR a context read).
    const clickable = total > 0;
    const cls = `t2-cluster ${isFlow ? "flowside" : ""} ${side === viewSide ? "viewing" : ""} ${noFlow ? "noflow" : ""} ${isContext ? "context" : ""}`;
    const act = clickable ? `onclick="setT2ViewSide('${side}')"` : "";
    const ttl = !clickable ? "No opening flow on this side — nothing to view"
      : isContext ? `Show ${side} settled OI at the ${other}-flow strikes (context)`
      : `Show the ${side} cluster's aggregate OI`;
    return `<button class="${cls}" ${act} ${clickable ? "" : "disabled"} title="${ttl}">
      <div class="t2-cl-top">
        <span class="t2-cl-side ${side}">${side === "call" ? "CALLS" : "PUTS"}</span>
        ${isFlow ? `<span class="t2-cl-flow">flow side</span>` : isContext ? `<span class="t2-cl-ctx">context</span>` : ""}
      </div>
      <div class="t2-cl-verdict" style="color:${m.c}"><span class="gate-dot ${m.d}"></span>${m.a} ${m.t}</div>
      <div class="t2-cl-sub">${sub}</div>
    </button>`;
  };
  return `<div class="t2-clusters">${card("call")}${card("put")}</div>`;
}
function setT2ViewSide(side) {
  if (state.t2ViewSide === side) return;
  state.t2ViewSide = side; state.t2Strike = null; state.t2Side = null;   // reset drill-down
  _t2Rerender();
}

/* Aggregate OI bars for a cluster — the PRIMARY "did it build" visual (the verdict
 * card is derived from this). Colored by the cluster's confirmation. */
function renderT2AggBars(sessions, conf, emptyMsg) {
  const col = conf === "building" ? "#9ECE6A" : conf === "unwinding" ? "#F7768E" : "#5a6378";
  return `<div class="t2-bars t2-bars-single">${_t2BarsSvg(sessions, col, emptyMsg)}</div>`;
}
/* Bar height that AMPLIFIES the day-to-day spread: OI over a week is often within a
 * narrow band (e.g. 900–1100), so a raw oi/max makes every bar look ~full. Scale to
 * the visible min→max range instead — shortest day ≈ 22%, tallest = 100% — so the
 * trend is obvious. Falls back to full height when all days are equal. */
function _t2BarH(oi, lo, hi) {
  if (hi <= lo) return 100;
  return 22 + (oi - lo) / (hi - lo) * 78;
}
/* Shared 5-bar OI markup (settled sessions, oldest→newest) used by the aggregate
 * and the per-strike drill-down. */
function _t2BarsSvg(sessions, col, emptyMsg) {
  const fmtK = n => n >= 1e12 ? `${(n / 1e12).toFixed(1)}T` : n >= 1e9 ? `${(n / 1e9).toFixed(1)}B`
                  : n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : `${n}`;
  if (!sessions.length) return `<div class="t2-bars-warming">${emptyMsg || "bars fill over the trading week"}</div>`;
  const ois = sessions.map(b => b.oi);
  const lo = Math.min(...ois), hi = Math.max(...ois);
  return sessions.map(b => {
    const h = _t2BarH(b.oi, lo, hi);
    const d = (b.date || "").slice(5);
    return `<div class="t2-bar-wrap" title="${d}: ${(b.oi || 0).toLocaleString()} OI (settled)">
      <span class="t2-bar-oi">${fmtK(b.oi)}</span>
      <div class="t2-bar t2-bar-big" style="height:${h}%;background:${col};border-color:${col};"></div>
      <span class="t2-bar-date">${d}</span></div>`;
  }).join("");
}

/* Per-strike drill-down for the VIEWED side: compact sparkline per strike that the
 * flow hit. Secondary to the cluster headline + aggregate; tap one to expand its
 * full 5-bar detail. (`strikes` is already filtered to the viewed side.) */
function renderT2StrikeMinis(strikes) {
  if (!strikes.length) return `<div class="t2-mini-empty">no flow-hit strikes on this side</div>`;
  // Near-dated cluster strikes (the ones in the headline %) first; far-dated after.
  const ordered = [...strikes].sort((a, b) => (b.in_aggregate ? 1 : 0) - (a.in_aggregate ? 1 : 0));
  const mini = (s) => {
    const sessions = s.sessions || [];
    const ois = sessions.map(b => b.oi);
    const lo = Math.min(...ois), hi = Math.max(...ois);
    const bars = sessions.length
      ? sessions.map(b => `<span class="t2-mini-bar" style="height:${_t2BarH(b.oi, lo, hi)}%"></span>`).join("")
      : `<span class="t2-mini-warm">—</span>`;
    const arrow = s.trend === "building" ? "↑" : s.trend === "unwinding" ? "↓" : "→";
    const aCol = s.trend === "building" ? "var(--ok)" : s.trend === "unwinding" ? "var(--neg)" : "var(--axis)";
    const on = state.t2Strike === s.strike;
    // Flag strikes NOT in the near-dated confirmation: expired, or far-dated LEAPS.
    const far = !s.in_aggregate;
    const tag = !far ? "" : (s.dte < 0 ? "exp'd" : s.dte > 365 ? "LEAP" : "far");
    return `<button class="t2-mini ${on ? "on" : ""} ${far ? "far" : ""}" onclick="toggleT2Strike(${s.strike})"
                    title="${far ? "not in the near-dated confirmation" : "in the near-dated confirmation"}">
      <span class="t2-mini-k">$${s.strike}</span>
      ${tag ? `<span class="t2-mini-tag">${tag}</span>` : ""}
      <span class="t2-mini-bars ${s.side}">${bars}</span>
      <span class="t2-mini-d" style="color:${aCol}">${arrow}</span></button>`;
  };
  return `<div class="t2-mini-list">${ordered.map(mini).join("")}</div>`;
}

function _t2Rerender() {
  const row = ROWS.find(r => r.ticker === state.selected);
  const slot = document.getElementById("tile2-slot");
  if (row && slot) slot.innerHTML = renderTile2OI(row);   // Tile 2 only — robust to other tiles
}
/* Drill-down toggle: expand/collapse one strike's full detail (within the viewed
 * side). Pure navigation — never changes the cluster read (observed evidence). */
function toggleT2Strike(k) {
  state.t2Strike = (state.t2Strike === k) ? null : k;
  _t2Rerender();
}

/* One (strike, side) at a time: headline ($strike SIDE · exp · $flow) + its 5-day
 * settled OI bars + ΔOI / net-delta / today vol-OI. */
function renderOiSingleStrike(s) {
  const fmtK = n => n >= 1e12 ? `${(n / 1e12).toFixed(1)}T` : n >= 1e9 ? `${(n / 1e9).toFixed(1)}B`
                  : n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : `${n}`;
  const fmtPrem = p => p >= 1e6 ? `$${(p / 1e6).toFixed(1)}M` : `$${Math.round(p / 1e3)}k`;
  const col = s.trend === "building" ? "#9ECE6A" : s.trend === "unwinding" ? "#F7768E" : "#5a6378";
  const sideCls = s.side === "call" ? "call" : "put";
  const bars = _t2BarsSvg(s.sessions || [], col);
  const voi = s.today_vol_oi || 0;
  const voiTxt = voi <= 0 ? "—" : voi >= 10 ? "10×+" : `${voi.toFixed(1)}×`;
  const deltaLbl = s.delta_oi > 0 ? `+${fmtK(s.delta_oi)}` : s.delta_oi < 0 ? `−${fmtK(Math.abs(s.delta_oi))}` : "0";
  const deltaColor = s.delta_oi > 0 ? "var(--ok)" : s.delta_oi < 0 ? "var(--neg)" : "var(--axis)";
  const trendBadge = s.trend === "building" ? "↑ building" : s.trend === "unwinding" ? "↓ unwinding" : "→ flat";
  // Context entry (this side had no opening flow — OI shown at a flow-side strike),
  // or a strike outside the near-dated cluster (expired / far-dated LEAP): say which.
  const excluded = s.is_context
    ? `<div class="t2-single-excl">context — no ${s.side} flow opened; this is ${s.side} settled OI at this strike</div>`
    : s.in_aggregate ? "" :
    `<div class="t2-single-excl">${s.dte < 0 ? "expired" : "far-dated"} — not in the near-dated confirmation</div>`;
  return `
    <div class="t2-single">
      <div class="t2-single-head">
        <span class="t2-strike-big">$${s.strike} <span class="t2-side ${sideCls}">${s.side.toUpperCase()}</span></span>
        <span class="t2-exp">${s.expiry ? "exp " + s.expiry : ""}</span>
        <span class="t2-prem">${s.premium_usd > 0 ? fmtPrem(s.premium_usd) + " flow" : ""}</span>
        <span class="t2-trend" style="color:${col}">${trendBadge}</span>
      </div>
      ${excluded}
      <div class="t2-bars t2-bars-single">${bars}</div>
      <div class="t2-single-foot">
        <span style="color:${deltaColor}">ΔOI ${deltaLbl}</span>
        <span class="t2-today" title="today's volume/OI ratio — OI confirms ~9am next session">today vol/OI ${voiTxt}</span>
      </div>
    </div>`;
}

/* Expiry RELEVANCE (collapsed): is the flow in tradeable near-dated expiries or
 * parked far out? The full premium-by-expiry breakdown belongs to Tile 4. */
function renderT2ExpiryRelevance(t2) {
  const pct = t2.near_dated_pct || 0;
  const c = pct >= 60 ? "var(--ok)" : pct >= 30 ? "var(--warn)" : "var(--neg)";
  const tail = pct >= 60 ? "most flow is in near expiries you'd actually trade"
             : pct >= 30 ? "partly near-term, partly parked further out"
             : "mostly parked in far-dated expiries — won't move on a short-term trade";
  return `<div class="t2-relevance">
    <span style="color:${c};font-weight:700">${pct.toFixed(0)}%</span> of flow $ expires within ~2 weeks (the weeklies you'd trade) — ${tail}.</div>`;
}

/* Gemini synthesis of the POSITIONING reality (row.insights.positioning) — narrates
 * whether the flow opened: cluster confirmation by side + near-dated relevance.
 * Observed read; does NOT follow the operator's toggle. */
function renderT2Synthesis(row) {
  const text = row.insights && row.insights.positioning;
  if (!text) return "";
  return `
    <div class="t1-synth">
      <span class="t1-synth-tag">✦ positioning read</span>
      <span class="t1-synth-body">${text}</span>
    </div>`;
}

/* ============================================================
 * Task 11: Tile 3 — Structural Setup (γ ladder SVG)
 * ============================================================ */

function renderTile3Structural(row) {
  const g = row.gates.structural;
  // Use top-level normalized fields (set by the server row shape)
  const gex = {
    flip_dist_pct: row.flip_dist_pct,
    wall_up_dist_pct: row.wall_up_dist_pct,
    wall_dn_dist_pct: row.wall_dn_dist_pct,
    agg_gamma_b: row.agg_gamma_b,
    sign: row.gex_sign,
  };
  const spot = row.spot;
  const status = row.gex_status || "ok";
  const flipStrike = spot * (1 + gex.flip_dist_pct / 100);
  const callWallStrike = spot * (1 + gex.wall_up_dist_pct / 100);
  const putWallStrike = spot * (1 - gex.wall_dn_dist_pct / 100);
  // No greek-exposure data for this ticker — show an honest limited state rather
  // than a fabricated flip/wall ladder.
  if (status === "unavailable") {
    return `
      <h3>
        <span><span class="gate-dot ${g}"></span>Tile 3: Structural Setup</span>
        <button class="help-icon" data-help="tile3">?</button>
      </h3>
      <div class="ladder-wrap" style="display:flex;align-items:center;justify-content:center;height:280px;">
        <div style="text-align:center;color:var(--axis);max-width:300px;">
          <div style="font-size:13px;font-weight:600;margin-bottom:6px;">Structural data limited</div>
          <div style="font-size:11px;line-height:1.5;">No dealer-gamma / greek-exposure data is available for <strong>${row.ticker}</strong> right now — usually a thinly-traded name. Flip &amp; walls can't be computed.</div>
        </div>
      </div>
      ${renderStructuralInsight(row, gex, spot, flipStrike, callWallStrike, putWallStrike)}
    `;
  }
  // "no_flip": γ doesn't cross zero within ±20% — render the ladder but show the
  // flip as out-of-range rather than a fake level.
  const flipMeta = status === "no_flip"
    ? `<span class="val">none within ±20%</span>`
    : `<span class="val">$${flipStrike.toFixed(2)} (${gex.flip_dist_pct >= 0 ? "+" : ""}${gex.flip_dist_pct.toFixed(1)}%)</span>`;
  // HONESTY: only draw the per-strike γ ladder when we have REAL net-gamma rungs.
  // No synthetic/fabricated bars — that would read as a real dealer-positioning map.
  // Flip & walls below come from the OI ladder server-side and stay shown.
  const realRungs = (row.tile3 && Array.isArray(row.tile3.strikes))
    ? row.tile3.strikes.filter(s => spot > 0 && Math.abs(s.strike / spot - 1) <= 0.08) : [];
  const ladderArea = realRungs.length >= 3
    ? `<div class="ladder-wrap">
        <svg viewBox="0 0 640 280" preserveAspectRatio="none" style="width:100%;height:280px;display:block;">
          <defs>
            <linearGradient id="ladderGradPos" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#7AA2F7" stop-opacity="1"/>
            </linearGradient>
            <linearGradient id="ladderGradNeg" x1="1" y1="0" x2="0" y2="0">
              <stop offset="0%" stop-color="#F7768E" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#F7768E" stop-opacity="1"/>
            </linearGradient>
            <filter id="ladderBarGlow" x="-10%" y="-30%" width="120%" height="160%">
              <feGaussianBlur stdDeviation="1.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          ${ladderSvg(row, gex, spot, flipStrike, callWallStrike, putWallStrike)}
        </svg>
      </div>`
    : `<div class="ladder-wrap" style="display:flex;align-items:center;justify-content:center;height:280px;">
        <div style="text-align:center;color:var(--axis);max-width:320px;">
          <div style="font-size:12px;font-weight:600;margin-bottom:6px;">Per-strike γ ladder warming</div>
          <div style="font-size:11px;line-height:1.5;">The dealer-gamma bar map isn't loaded yet for <strong>${row.ticker}</strong>. Flip &amp; walls below are computed from the OI ladder; the full bar detail fills in on the rich load.</div>
        </div>
      </div>`;
  return `
    <h3>
      <span><span class="gate-dot ${g}"></span>Tile 3: Structural Setup</span>
      <button class="help-icon" data-help="tile3">?</button>
    </h3>
    ${ladderArea}
    <div class="ladder-meta">
      <div class="m"><span class="lbl">Spot</span><span class="val">$${spot.toFixed(2)}</span></div>
      <div class="m"><span class="lbl">γ Flip</span>${flipMeta}</div>
      <div class="m"><span class="lbl">Walls</span><span class="val">+${gex.wall_up_dist_pct.toFixed(1)}% / −${gex.wall_dn_dist_pct.toFixed(1)}%</span></div>
    </div>
    ${renderStructuralInsight(row, gex, spot, flipStrike, callWallStrike, putWallStrike)}
  `;
}

/* 3-sentence structural-setup insight. Prefer Gemini-generated prose from the
 * snapshot (row.insights.structural); fall back to deterministic template
 * when the Gemini call failed or hasn't run yet. */
function renderStructuralInsight(row, gex, spot, flipStrike, callWall, putWall) {
  if (row.insights && row.insights.structural) {
    return `
      <div class="insight" data-llm="gemini">
        <div class="label">chart insight · Gemini</div>
        ${row.insights.structural}
      </div>
    `;
  }
  const isCall = row.direction === "calls";
  const flipPct = gex.flip_dist_pct;
  const flipDir = flipPct >= 0 ? "above" : "below";
  const flipNear = Math.abs(flipPct) <= CALIBRATION.gate3_flip_dist_pct;
  const dirWallPct = isCall ? gex.wall_up_dist_pct : gex.wall_dn_dist_pct;
  const oppWallPct = isCall ? gex.wall_dn_dist_pct : gex.wall_up_dist_pct;
  const dirWallTight = dirWallPct <= 2.0;
  const oppFloor = oppWallPct <= CALIBRATION.protected_itm_opp_wall_pct;

  // Sentence 1 — flip context
  let s1;
  if (flipNear) {
    s1 = `Spot is <strong>${Math.abs(flipPct).toFixed(1)}% ${flipDir}</strong> the γ flip — close enough that a small move <em>${isCall ? "up" : "down"}</em> would cross dealers from short to long γ, which amplifies the move in your direction.`;
  } else {
    s1 = `Spot is <strong>${Math.abs(flipPct).toFixed(1)}% ${flipDir}</strong> the γ flip — far enough that a structural cross isn't the near-term driver here.`;
  }
  // Sentence 2 — wall context
  let s2;
  if (dirWallTight) {
    s2 = `The ${isCall ? "call" : "put"} wall sits only <strong>${dirWallPct.toFixed(1)}%</strong> ${isCall ? "above" : "below"} spot — that's a hard resistance for your ${row.direction}; it usually <em>caps</em> the move before earnings or a clean catalyst.`;
  } else if (oppFloor) {
    s2 = `The opposing wall is only <strong>${oppWallPct.toFixed(1)}%</strong> away — that gives an ITM strike a structural floor, since dealers defend that level.`;
  } else {
    s2 = `Nearest wall in your direction is <strong>${dirWallPct.toFixed(1)}%</strong> away — wide enough that the bars between spot and the wall are a clean runway for the trade.`;
  }
  // Sentence 3 — overall read
  let s3;
  if (row.gates.structural === "green") s3 = `Net read: structure <em>favors</em> the ${row.direction} side.`;
  else if (row.gates.structural === "yellow") s3 = `Net read: structure is <em>neutral</em> — not helping, not hurting.`;
  else s3 = `Net read: structure <em>fights</em> this trade; consider waiting for a better setup.`;

  return `
    <div class="insight" data-llm-future="tile3_structural_insight">
      <div class="label">chart insight · pre-wired Gemini call</div>
      ${s1} ${s2} ${s3}
    </div>
  `;
}

function ladderSvg(row, gex, spot, flipStrike, callWallStrike, putWallStrike) {
  // Vertical ladder of synthesized strikes with bars — taller canvas + fewer
  // strikes so individual bars are visibly thick.
  const h = strHash(row.ticker);
  const padT = 14, padB = 22, padL = 70, padR = 110;
  const W = 640, H = 280;
  const innerH = H - padT - padB, innerW = W - padL - padR;
  const minStrike = Math.min(putWallStrike, spot * 0.94);
  const maxStrike = Math.max(callWallStrike, spot * 1.06);
  const yForStrike = s => padT + innerH * (1 - (s - minStrike) / (maxStrike - minStrike));

  const centerX = padL + innerW / 2;

  // Strikes + per-strike γ: REAL net dealer gamma when the snapshot provides it
  // (row.tile3, from spot-exposures/strike), else the synthetic fallback so the
  // ladder still renders while warming or after a UW failure.
  const realRungs = (row.tile3 && Array.isArray(row.tile3.strikes))
    ? row.tile3.strikes.filter(s => s.strike >= minStrike && s.strike <= maxStrike)
                       .sort((a, b) => a.strike - b.strike)
    : [];
  // Real net-gamma rungs ONLY — no synthetic fallback. The caller gates on this
  // too; if we somehow get here without real data, render nothing fabricated.
  const realGamma = realRungs.length >= 3;
  if (!realGamma) {
    return `<text x="320" y="140" text-anchor="middle" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="12">per-strike γ ladder unavailable</text>`;
  }
  const strikes = realRungs.map(s => s.strike);
  const gammaByStrike = realRungs.map(s => s.net_gamma);

  // Per-view scaling: biggest |γ| in THIS view reaches ~90% of the half-track,
  // never clipping. Works for any magnitude (real γ runs to billions).
  const observedMax = Math.max(...gammaByStrike.map(g => Math.abs(g)), 1e-9);
  const maxAbsG = observedMax / 0.90;
  const halfTrack = innerW / 2 - 6;
  const xForGamma = g => centerX + (g / maxAbsG) * halfTrack;

  // Bar thickness: from the tightest real strike spacing so dense grids don't
  // overlap; the synthetic 7-strike view keeps its original even spacing.
  let barH;
  if (realGamma && strikes.length > 1) {
    let minGap = innerH;
    for (let i = 1; i < strikes.length; i++)
      minGap = Math.min(minGap, Math.abs(yForStrike(strikes[i]) - yForStrike(strikes[i - 1])));
    barH = Math.max(3, Math.min(minGap - 2, 16));
  } else {
    barH = innerH / strikes.length - 2;
  }
  const showBarLabel = barH >= 11;

  // Compact γ label for real dollar-gamma; synthetic stays in its ~±2 range.
  const fmtG = realGamma
    ? (v => { const a = Math.abs(v), s = v >= 0 ? "+" : "−";
              return a >= 1e9 ? s + (a / 1e9).toFixed(1) + "B"
                   : a >= 1e6 ? s + (a / 1e6).toFixed(0) + "M"
                   : a >= 1e3 ? s + (a / 1e3).toFixed(0) + "K" : s + a.toFixed(0); })
    : (v => (v >= 0 ? `+${v.toFixed(1)}` : v.toFixed(1)));

  let svg = "";

  // Faint full-width row guides so each strike's lane is obvious
  for (let i = 0; i < strikes.length; i++) {
    const y = yForStrike(strikes[i]);
    svg += `<rect x="${padL}" y="${(y - barH/2).toFixed(1)}" width="${innerW}" height="${barH.toFixed(1)}" fill="rgba(255,255,255,0.018)" rx="2"/>`;
  }

  // Strike bars — length ∝ |net γ|, right = long γ (blue), left = short γ (red)
  for (let i = 0; i < strikes.length; i++) {
    const s = strikes[i];
    const g = gammaByStrike[i];
    const y = yForStrike(s);
    const x = xForGamma(g);
    const isPos = g >= 0;
    const barFill = isPos
      ? "url(#ladderGradPos)"
      : "url(#ladderGradNeg)";
    const barW = Math.max(3, Math.abs(x - centerX));
    svg += `<rect x="${Math.min(centerX, x).toFixed(1)}" y="${(y - barH/2).toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${barFill}" rx="2" filter="url(#ladderBarGlow)"/>`;
    // γ value label inside the bar when wide enough, otherwise just outside —
    // suppressed on dense real-strike grids where rows are too thin to read.
    if (showBarLabel) {
      const gFmt = fmtG(g);
      const labelInside = barW >= 28;
      const labelX = labelInside
        ? (isPos ? x - 4 : x + 4)
        : (isPos ? x + 5 : x - 5);
      const labelAnchor = labelInside
        ? (isPos ? "end" : "start")
        : (isPos ? "start" : "end");
      const labelFill = labelInside ? "#FFFFFF" : "var(--axis)";
      const labelWeight = labelInside ? "700" : "400";
      svg += `<text x="${labelX.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="${labelAnchor}" fill="${labelFill}" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10" font-weight="${labelWeight}">${gFmt}</text>`;
    }
    if (showBarLabel || i % 2 === 0)
      svg += `<text x="${(padL - 6).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10">$${s.toFixed(s>100?0:2)}</text>`;
  }

  // Vertical centerline (zero γ axis)
  svg += `<line x1="${centerX}" x2="${centerX}" y1="${padT}" y2="${padT + innerH}" stroke="var(--axis)" stroke-width="0.8"/>`;
  // Axis tick marks at ±50% and ±100% of the scaled max (oriented around 0)
  const tickValues = [-maxAbsG, -maxAbsG/2, maxAbsG/2, maxAbsG];
  for (const tv of tickValues) {
    const tx = xForGamma(tv);
    svg += `<line x1="${tx.toFixed(1)}" x2="${tx.toFixed(1)}" y1="${(padT + innerH).toFixed(1)}" y2="${(padT + innerH + 4).toFixed(1)}" stroke="var(--axis)" stroke-width="0.6"/>`;
    svg += `<text x="${tx.toFixed(1)}" y="${(padT + innerH + 13).toFixed(1)}" text-anchor="middle" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9">${fmtG(tv)}</text>`;
  }
  svg += `<text x="${centerX}" y="${padT + innerH + 13}" text-anchor="middle" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9">0</text>`;
  // Left & right axis labels
  svg += `<text x="${padL + 4}" y="${padT + 10}" text-anchor="start" fill="var(--neg)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9" font-weight="600">◀ short γ</text>`;
  svg += `<text x="${padL + innerW - 4}" y="${padT + 10}" text-anchor="end" fill="var(--pos)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9" font-weight="600">long γ ▶</text>`;

  // Spot line (orange solid)
  const ys = yForStrike(spot);
  svg += `<line x1="${padL}" x2="${padL + innerW}" y1="${ys}" y2="${ys}" stroke="var(--warn)" stroke-width="2"/>`;
  svg += `<text x="${padL + innerW + 6}" y="${ys + 4}" fill="var(--warn)" font-family="ui-monospace,monospace" font-size="11" font-weight="700">SPOT $${spot.toFixed(spot > 100 ? 0 : 2)}</text>`;

  // Gamma flip line (purple dashed) — suppressed when there's no flip in range.
  if ((row.gex_status || "ok") !== "no_flip") {
    const yf = yForStrike(flipStrike);
    svg += `<line x1="${padL}" x2="${padL + innerW}" y1="${yf}" y2="${yf}" stroke="var(--hot)" stroke-width="1.5" stroke-dasharray="4,3"/>`;
    svg += `<text x="${padL + innerW + 6}" y="${yf + 4}" fill="var(--hot)" font-family="ui-monospace,monospace" font-size="11" font-weight="700">FLIP $${flipStrike.toFixed(flipStrike > 100 ? 0 : 2)}</text>`;
  }

  // Wall callouts (call wall above, put wall below) — labels on RIGHT side now that we have width
  const yCW = yForStrike(callWallStrike);
  const yPW = yForStrike(putWallStrike);
  if (yCW >= padT && yCW <= padT + innerH) {
    svg += `<line x1="${padL}" x2="${padL + innerW}" y1="${yCW}" y2="${yCW}" stroke="var(--pos)" stroke-width="1" stroke-dasharray="2,3" opacity="0.7"/>`;
    svg += `<text x="${padL + innerW + 6}" y="${yCW + 4}" fill="var(--pos)" font-family="ui-monospace,monospace" font-size="10">CALL WALL $${callWallStrike.toFixed(callWallStrike > 100 ? 0 : 2)}</text>`;
  }
  if (yPW >= padT && yPW <= padT + innerH) {
    svg += `<line x1="${padL}" x2="${padL + innerW}" y1="${yPW}" y2="${yPW}" stroke="var(--neg)" stroke-width="1" stroke-dasharray="2,3" opacity="0.7"/>`;
    svg += `<text x="${padL + innerW + 6}" y="${yPW + 4}" fill="var(--neg)" font-family="ui-monospace,monospace" font-size="10">PUT WALL $${putWallStrike.toFixed(putWallStrike > 100 ? 0 : 2)}</text>`;
  }

  return svg;
}

/* ============================================================
 * Tile 3 Phase 2 — rich on-demand gamma map (2× footprint):
 * OI/Vol toggle, expiry tabs, diverging call/put ladder (scale-fixed),
 * structural levels + charm/vanna drift. Fed by /api/tile3/{ticker}.
 * ============================================================ */

// Per-view freshness line: "as of 10:42 ET · cache" tinted stale when the view's
// oldest contributing field exceeds `staleSec`. `asOf` is an ISO string from the
// view payload; `prov` ∈ live|cache|archive. Self-contained — does NOT use the
// chart-local fmtET (which takes epoch seconds, not an ISO string).
function freshnessLine(asOf, prov, staleSec) {
  if (!asOf) return "";
  const d = new Date(asOf);
  if (isNaN(d.getTime())) return "";
  const ageSec = (Date.now() - d.getTime()) / 1000;
  const stale = ageSec > (staleSec || 300);
  const hhmm = d.toLocaleTimeString("en-US", {timeZone: "America/New_York", hour: "numeric", minute: "2-digit"});
  const provTag = prov && prov !== "live" ? ` · ${prov}` : "";
  return `<span class="t-asof ${stale ? "stale" : ""}" title="oldest contributing field${provTag}">as of ${hhmm} ET${provTag}</span>`;
}

function renderTile3Rich(row, detail) {
  const g = row.gates.structural;
  const spot = detail.spot || row.spot;
  let expiry = state.tile3Expiry;
  if (!expiry || !detail.views[expiry]) expiry = detail.default_expiry;
  const view = detail.views[expiry] || Object.values(detail.views)[0];
  if (!view) return renderTile3Structural(row);
  const w = state.tile3Weighting === "vol" ? "vol" : "oi";

  const short = view.regime === "short";
  const bannerHead = short ? "TREND — moves amplified" : "PIN — moves dampened";
  const flipStrike = spot * (1 + (view.flip_pct || 0) / 100);
  const flipNear = view.flip_status === "ok" && Math.abs(view.flip_pct || 0) <= 9;
  const sentence = short
    ? `Dealers are <strong>short γ</strong> here — breakouts have fuel. ${flipNear ? `γ flip ${view.flip_pct >= 0 ? "above" : "below"} spot at $${flipStrike.toFixed(0)}.` : "No γ flip in the near range."}`
    : `Dealers are <strong>long γ</strong> — moves get dampened, price pins. ${flipNear ? `Flip at $${flipStrike.toFixed(0)} (${view.flip_pct.toFixed(1)}%).` : "Flip is out of the near range."}`;

  // VOL is NOT a co-equal basis — structure (flip/walls/regime) is always OI. Volume
  // weighting is a same-day freshness overlay (where today's contracts traded), never
  // a second way to read dealer structure. So: OI is the fixed basis label + a single
  // secondary overlay toggle, not two peer buttons.
  const overlayOn = w === "vol";
  const wControl = `<span class="t3-basis">open interest</span>`
    + `<button class="t3-overlay ${overlayOn ? "on" : ""}" onclick="setTile3Weighting('${overlayOn ? "oi" : "vol"}')"`
    + ` title="Reweight the bars by TODAY'S volume — a freshness check when OI is stale (0DTE-heavy days), not a second structure read.">`
    + `⊕ today's activity${overlayOn ? " ✓" : ""}</button>`;
  const expTabs = Object.entries(detail.views).map(([e, v]) =>
    `<button class="t3-tog ${e === expiry ? "on" : ""}" onclick="setTile3Expiry('${e}')">${v.label} <span class="t3-tag">${v.tag}</span></button>`).join("");

  const flipVal = view.flip_status === "ok"
    ? `$${flipStrike.toFixed(2)} (${view.flip_pct >= 0 ? "+" : ""}${view.flip_pct.toFixed(1)}%)`
    : "none in ±9%";
  const lvl = (lbl, val, cls) => `<div class="t3-lvl ${cls || ""}"><span class="l">${lbl}</span><span class="v">${val}</span></div>`;
  const levels = `
    ${lvl("Call wall", view.call_wall != null ? `$${view.call_wall.toFixed(2)}` : "—", "up")}
    ${lvl("γ Flip", flipVal, "flip")}
    ${lvl("Spot", `$${spot.toFixed(2)}`, "spot")}
    ${lvl("Put wall", view.put_wall != null ? `$${view.put_wall.toFixed(2)}` : "—", "dn")}`;

  let drift = "";
  if (detail.drift_available) {
    drift = `<div class="t3-drift">
      <div class="t3-drift-h">DRIFT · ${view.dte}DTE</div>
      ${driftGauge("Charm · time pull", view.charm)}
      ${driftGauge("Vanna · vol pull", view.vanna)}
    </div>`;
  }

  return `
    <h3>
      <span><span class="gate-dot ${g}"></span>Tile 3: Structural Setup</span>
      <button class="help-icon" data-help="tile3">?</button>${freshnessLine(detail.as_of, detail.data_provenance, 300)}
    </h3>
    <div class="t3-banner ${short ? "short" : "long"}">
      <div class="t3-banner-h">${bannerHead}</div>
      <div class="t3-banner-s">${sentence}</div>
    </div>
    <div class="t3-controls">
      <div class="t3-grp"><span class="t3-grp-l">Structure</span>${wControl}</div>
      <div class="t3-grp t3-grp-exp"><span class="t3-grp-l">Expiry</span>${expTabs}</div>
    </div>
    <div class="t3-body">
      <div class="t3-ladder">${richLadderSvg(view, w, spot)}</div>
      <div class="t3-side">
        <div class="t3-levels">${levels}</div>
        ${drift}
      </div>
    </div>
    <div class="t3-howto">
      Bars: <strong style="color:var(--pos)">right = call γ</strong> (resistance / ceiling) · <strong style="color:var(--neg)">left = put γ</strong> (support / floor). Taller = dealers defend it harder. The <span style="color:var(--hot)">flip</span> is where the regime switches. Structure — flip, walls, regime — is always from <strong>open interest</strong> (standing positions dealers must hedge). <strong>Today's activity</strong> reweights the bars by what traded today: a same-day freshness check when OI is stale (0DTE-heavy days), <em>not</em> a second way to read structure. Switch <strong>expiry</strong> — the regime can differ week to week.
      <div class="t3-prov">🔵 LIVE · spot-exposures/expiry-strike + greek-exposure/expiry · real-time structural snapshot, not a forecast.</div>
    </div>`;
}

function driftGauge(label, d) {
  const dir = (d && d.dir) || "flat";
  const mag = Math.sqrt(Math.min(1, Math.abs((d && d.value) || 0) / 1e9));
  const pct = Math.max(5, Math.round(mag * 100));
  const up = dir.indexOf("up") === 0;
  const cls = up ? "up" : dir === "down" ? "dn" : "";
  const arrow = up ? "▲" : dir === "down" ? "▼" : "•";
  const note = dir === "up_if_iv_rises" ? "up if IV rises"
    : dir === "up_if_iv_falls" ? "up if IV falls"
    : dir === "up" ? "upward as time passes"
    : dir === "down" ? "downward as time passes" : "neutral";
  return `<div class="t3-gauge"><span class="g-l">${label}</span><span class="g-bar"><span class="g-fill ${cls}" style="width:${pct}%"></span></span><span class="g-n ${cls}">${arrow} ${note}</span></div>`;
}

function richLadderSvg(view, w, spot) {
  const rungs = (view[w] || []).slice().sort((a, b) => a.strike - b.strike);
  if (rungs.length < 2) {
    return `<div style="display:flex;align-items:center;justify-content:center;height:340px;color:var(--axis);font-size:12px;">No strike-level γ in this expiry/weighting.</div>`;
  }
  const W = 720, H = 340, padT = 18, padB = 26, padL = 78, padR = 120;
  const innerH = H - padT - padB, innerW = W - padL - padR;
  const minK = rungs[0].strike, maxK = rungs[rungs.length - 1].strike;
  const span = (maxK - minK) || 1;
  // Scale fix: y maps strikes over the ACTUAL rung range (tight — no dead space).
  const yFor = k => padT + innerH * (1 - (k - minK) / span);
  const centerX = padL + innerW / 2;
  const half = innerW / 2 - 8;
  let maxG = 0;
  for (const r of rungs) maxG = Math.max(maxG, Math.abs(r.call_gamma || 0), Math.abs(r.put_gamma || 0));
  maxG = (maxG || 1) / 0.92;
  const barH = Math.max(3, Math.min(innerH / rungs.length - 2, 13));
  const fmtG = v => { const a = Math.abs(v), s = v >= 0 ? "" : "−"; return a >= 1e9 ? s + (a / 1e9).toFixed(1) + "B" : a >= 1e6 ? s + Math.round(a / 1e6) + "M" : a >= 1e3 ? s + Math.round(a / 1e3) + "K" : s + Math.round(a); };

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:340px;display:block;">
    <defs>
      <linearGradient id="rlPos" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.55"/><stop offset="100%" stop-color="#7AA2F7" stop-opacity="1"/></linearGradient>
      <linearGradient id="rlNeg" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#F7768E" stop-opacity="0.55"/><stop offset="100%" stop-color="#F7768E" stop-opacity="1"/></linearGradient>
    </defs>`;
  // strike lane guides + bars
  const labelEvery = Math.ceil(rungs.length / 12);
  for (let i = 0; i < rungs.length; i++) {
    const r = rungs[i], y = yFor(r.strike);
    svg += `<rect x="${padL}" y="${(y - barH / 2).toFixed(1)}" width="${innerW}" height="${barH.toFixed(1)}" fill="rgba(255,255,255,0.015)" rx="2"/>`;
    const cw = Math.max(0, Math.abs(r.call_gamma || 0) / maxG * half);
    const pw = Math.max(0, Math.abs(r.put_gamma || 0) / maxG * half);
    if (cw > 0.5) svg += `<rect x="${centerX.toFixed(1)}" y="${(y - barH / 2).toFixed(1)}" width="${cw.toFixed(1)}" height="${barH.toFixed(1)}" fill="url(#rlPos)" rx="2"/>`;
    if (pw > 0.5) svg += `<rect x="${(centerX - pw).toFixed(1)}" y="${(y - barH / 2).toFixed(1)}" width="${pw.toFixed(1)}" height="${barH.toFixed(1)}" fill="url(#rlNeg)" rx="2"/>`;
    if (i % labelEvery === 0)
      svg += `<text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10">$${r.strike.toFixed(r.strike > 100 ? 0 : 2)}</text>`;
  }
  // center axis + side labels
  svg += `<line x1="${centerX}" x2="${centerX}" y1="${padT}" y2="${padT + innerH}" stroke="var(--axis)" stroke-width="0.8"/>`;
  svg += `<text x="${padL + 4}" y="${padT - 5}" fill="var(--neg)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9" font-weight="600">◀ put γ (floor)</text>`;
