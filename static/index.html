      </div>
      <div class="t2-card">
        <span class="lbl">5-day OI trend</span>
        <span class="val" style="color:${trendColor}">${trendArrow} ${trendPct >= 0 ? "+" : ""}${trendPct.toFixed(0)}%</span>
        <span class="sub">${trendSub}</span>
      </div>
      <div class="t2-card">
        <span class="lbl">Confirmation</span>
        <span class="val" style="color:${conf.c}"><span class="gate-dot ${conf.d}"></span>${conf.t}</span>
        <span class="sub">positioning</span>
      </div>
    </div>`;
}

/* Grouped bar chart: per focus-strike, one bar per archived session.
 * Scale is per-strike-group (NOT global) per spec. Today's bar is hollow
 * (provisional). Bar color: green building / gray flat / red unwinding. */
function renderOiSessionChart(t2) {
  const strikes = t2.strikes || [];
  const fmtK = n => n >= 1e12 ? `${(n / 1e12).toFixed(1)}T`
                  : n >= 1e9  ? `${(n / 1e9).toFixed(1)}B`
                  : n >= 1e6  ? `${(n / 1e6).toFixed(1)}M`
                  : n >= 1e3  ? `${Math.round(n / 1e3)}k` : `${n}`;
  const fmtPrem = p => p >= 1e6 ? `$${(p / 1e6).toFixed(1)}M` : `$${Math.round(p / 1e3)}k`;
  const trendColor = t => t === "building" ? "#9ECE6A" : t === "unwinding" ? "#F7768E" : "#5a6378";

  const groups = strikes.map(s => {
    const sessions = s.sessions || [];          // SETTLED days only
    const maxOi = Math.max(...sessions.map(b => b.oi), 1);  // per-group scale
    const col = trendColor(s.trend);
    const bars = sessions.length
      ? sessions.map(b => {
          const hPct = Math.max(2, (b.oi / maxOi) * 100);
          const dateLbl = (b.date || "").slice(5);  // MM-DD
          return `<div class="t2-bar-wrap" title="${dateLbl}: ${b.oi.toLocaleString()} OI (settled)">
            <div class="t2-bar" style="height:${hPct}%;background:${col};border-color:${col};"></div>
            <span class="t2-bar-date">${dateLbl}</span>
          </div>`;
        }).join("")
      : `<div class="t2-bars-warming">settled bars build over the week</div>`;
    // Today = live vol/OI ratio (NOT a settled bar) — spec hard rule.
    const voi = s.today_vol_oi || 0;
    const voiTxt = voi <= 0 ? "" : voi >= 10 ? "10×+" : `${voi.toFixed(1)}×`;
    const todayCell = voiTxt
      ? `<div class="t2-today" title="Today's volume/OI ratio — OI confirms ~9am next session">
           <span class="t2-today-lbl">today</span>
           <span class="t2-today-val">${voiTxt}</span>
         </div>`
      : "";
    const deltaLbl = s.delta_oi > 0 ? `+${fmtK(s.delta_oi)}` : s.delta_oi < 0 ? `−${fmtK(Math.abs(s.delta_oi))}` : "0";
    const deltaColor = s.delta_oi > 0 ? "var(--ok)" : s.delta_oi < 0 ? "var(--neg)" : "var(--axis)";
    const premLbl = s.premium_usd > 0 ? fmtPrem(s.premium_usd) : "";
    const hasDelta = Math.abs(s.net_delta) >= 1;
    const deltaSign = s.net_delta >= 0 ? "+" : "−";
    return `
      <div class="t2-group">
        <div class="t2-group-head">
          <span class="t2-strike">$${s.strike}</span>
          ${premLbl ? `<span class="t2-prem">${premLbl} flow</span>` : ""}
        </div>
        <div class="t2-bars">${bars}</div>
        ${todayCell}
        <div class="t2-group-foot">
          <span style="color:${deltaColor}">ΔOI ${deltaLbl}</span>
          <span class="t2-netdelta">${hasDelta ? `δ ${deltaSign}${fmtK(Math.abs(Math.round(s.net_delta)))}` : "δ —"}</span>
        </div>
      </div>`;
  }).join("");
  return `<div class="t2-chart">${groups}</div>`;
}

/* Horizontal expiry-distribution bar: where premium concentrates by expiry. */
function renderExpiryDistribution(dist) {
  if (!dist || dist.length === 0) return "";
  const colors = ["#7AA2F7", "#BB9AF7", "#9ECE6A", "#E0AF68", "#F7768E", "#7DCFFF"];
  const segs = dist.slice(0, 6).map((d, i) => {
    const c = colors[i % colors.length];
    return `<div class="t2-exp-seg" style="width:${d.pct}%;background:${c};"
                 title="${d.expiry}: ${d.pct.toFixed(0)}% of flow premium"></div>`;
  }).join("");
  const legend = dist.slice(0, 6).map((d, i) => {
    const c = colors[i % colors.length];
    return `<span class="t2-exp-leg"><span class="sw" style="background:${c}"></span>${d.expiry} ${d.pct.toFixed(0)}%</span>`;
  }).join("");
  return `
    <div class="t2-expiry">
      <div class="t2-exp-title">Flow premium by expiry</div>
      <div class="t2-exp-bar">${segs}</div>
      <div class="t2-exp-legend">${legend}</div>
    </div>`;
}

/* ============================================================
 * Task 11: Tile 3 — Structural Setup (γ ladder SVG)
 * ============================================================ */

function renderTile3Structural(row) {
  const g = row.gates.structural;
  // Use top-level normalized fields (set by enrichLive / normalizeSynth)
  const gex = {
    flip_dist_pct: row.flip_dist_pct,
    wall_up_dist_pct: row.wall_up_dist_pct,
    wall_dn_dist_pct: row.wall_dn_dist_pct,
    agg_gamma_b: row.agg_gamma_b,
    sign: row.gex_sign,
  };
  const spot = row.spot;
  const status = row.gex_status || "ok";
  const flipStrike = spot * (1 + gex.flip_dist_pct / 100);
  const callWallStrike = spot * (1 + gex.wall_up_dist_pct / 100);
  const putWallStrike = spot * (1 - gex.wall_dn_dist_pct / 100);
  // No greek-exposure data for this ticker — show an honest limited state rather
  // than a fabricated flip/wall ladder.
  if (status === "unavailable") {
    return `
      <h3>
        <span><span class="gate-dot ${g}"></span>Tile 3: Structural Setup</span>
        <button class="help-icon" data-help="tile3">?</button>
      </h3>
      <div class="ladder-wrap" style="display:flex;align-items:center;justify-content:center;height:280px;">
        <div style="text-align:center;color:var(--axis);max-width:300px;">
          <div style="font-size:13px;font-weight:600;margin-bottom:6px;">Structural data limited</div>
          <div style="font-size:11px;line-height:1.5;">No dealer-gamma / greek-exposure data is available for <strong>${row.ticker}</strong> right now — usually a thinly-traded name. Flip &amp; walls can't be computed.</div>
        </div>
      </div>
      ${renderStructuralInsight(row, gex, spot, flipStrike, callWallStrike, putWallStrike)}
    `;
  }
  // "no_flip": γ doesn't cross zero within ±20% — render the ladder but show the
  // flip as out-of-range rather than a fake level.
  const flipMeta = status === "no_flip"
    ? `<span class="val">none within ±20%</span>`
    : `<span class="val">$${flipStrike.toFixed(2)} (${gex.flip_dist_pct >= 0 ? "+" : ""}${gex.flip_dist_pct.toFixed(1)}%)</span>`;
  return `
    <h3>
      <span><span class="gate-dot ${g}"></span>Tile 3: Structural Setup</span>
      <button class="help-icon" data-help="tile3">?</button>
    </h3>
    <div class="ladder-wrap">
      <svg viewBox="0 0 640 280" preserveAspectRatio="none" style="width:100%;height:280px;display:block;">
        <defs>
          <linearGradient id="ladderGradPos" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#7AA2F7" stop-opacity="1"/>
          </linearGradient>
          <linearGradient id="ladderGradNeg" x1="1" y1="0" x2="0" y2="0">
            <stop offset="0%" stop-color="#F7768E" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#F7768E" stop-opacity="1"/>
          </linearGradient>
          <filter id="ladderBarGlow" x="-10%" y="-30%" width="120%" height="160%">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        ${ladderSvg(row, gex, spot, flipStrike, callWallStrike, putWallStrike)}
      </svg>
    </div>
    <div class="ladder-meta">
      <div class="m"><span class="lbl">Spot</span><span class="val">$${spot.toFixed(2)}</span></div>
      <div class="m"><span class="lbl">γ Flip</span>${flipMeta}</div>
      <div class="m"><span class="lbl">Walls</span><span class="val">+${gex.wall_up_dist_pct.toFixed(1)}% / −${gex.wall_dn_dist_pct.toFixed(1)}%</span></div>
    </div>
    ${renderStructuralInsight(row, gex, spot, flipStrike, callWallStrike, putWallStrike)}
  `;
}

/* 3-sentence structural-setup insight. Prefer Gemini-generated prose from the
 * snapshot (row.insights.structural); fall back to deterministic template
 * when the Gemini call failed or hasn't run yet. */
function renderStructuralInsight(row, gex, spot, flipStrike, callWall, putWall) {
  if (row.insights && row.insights.structural) {
    return `
      <div class="insight" data-llm="gemini">
        <div class="label">chart insight · Gemini</div>
        ${row.insights.structural}
      </div>
    `;
  }
  const isCall = row.direction === "calls";
  const flipPct = gex.flip_dist_pct;
  const flipDir = flipPct >= 0 ? "above" : "below";
  const flipNear = Math.abs(flipPct) <= CALIBRATION.gate3_flip_dist_pct;
  const dirWallPct = isCall ? gex.wall_up_dist_pct : gex.wall_dn_dist_pct;
  const oppWallPct = isCall ? gex.wall_dn_dist_pct : gex.wall_up_dist_pct;
  const dirWallTight = dirWallPct <= 2.0;
  const oppFloor = oppWallPct <= CALIBRATION.protected_itm_opp_wall_pct;

  // Sentence 1 — flip context
  let s1;
  if (flipNear) {
    s1 = `Spot is <strong>${Math.abs(flipPct).toFixed(1)}% ${flipDir}</strong> the γ flip — close enough that a small move <em>${isCall ? "up" : "down"}</em> would cross dealers from short to long γ, which amplifies the move in your direction.`;
  } else {
    s1 = `Spot is <strong>${Math.abs(flipPct).toFixed(1)}% ${flipDir}</strong> the γ flip — far enough that a structural cross isn't the near-term driver here.`;
  }
  // Sentence 2 — wall context
  let s2;
  if (dirWallTight) {
    s2 = `The ${isCall ? "call" : "put"} wall sits only <strong>${dirWallPct.toFixed(1)}%</strong> ${isCall ? "above" : "below"} spot — that's a hard resistance for your ${row.direction}; it usually <em>caps</em> the move before earnings or a clean catalyst.`;
  } else if (oppFloor) {
    s2 = `The opposing wall is only <strong>${oppWallPct.toFixed(1)}%</strong> away — that gives an ITM strike a structural floor, since dealers defend that level.`;
  } else {
    s2 = `Nearest wall in your direction is <strong>${dirWallPct.toFixed(1)}%</strong> away — wide enough that the bars between spot and the wall are a clean runway for the trade.`;
  }
  // Sentence 3 — overall read
  let s3;
  if (row.gates.structural === "green") s3 = `Net read: structure <em>favors</em> the ${row.direction} side.`;
  else if (row.gates.structural === "yellow") s3 = `Net read: structure is <em>neutral</em> — not helping, not hurting.`;
  else s3 = `Net read: structure <em>fights</em> this trade; consider waiting for a better setup.`;

  return `
    <div class="insight" data-llm-future="tile3_structural_insight">
      <div class="label">chart insight · pre-wired Gemini call</div>
      ${s1} ${s2} ${s3}
    </div>
  `;
}

function ladderSvg(row, gex, spot, flipStrike, callWallStrike, putWallStrike) {
  // Vertical ladder of synthesized strikes with bars — taller canvas + fewer
  // strikes so individual bars are visibly thick.
  const h = strHash(row.ticker);
  const padT = 14, padB = 22, padL = 70, padR = 110;
  const W = 640, H = 280;
  const innerH = H - padT - padB, innerW = W - padL - padR;
  const minStrike = Math.min(putWallStrike, spot * 0.94);
  const maxStrike = Math.max(callWallStrike, spot * 1.06);
  const yForStrike = s => padT + innerH * (1 - (s - minStrike) / (maxStrike - minStrike));

  const centerX = padL + innerW / 2;

  // Strikes + per-strike γ: REAL net dealer gamma when the snapshot provides it
  // (row.tile3, from spot-exposures/strike), else the synthetic fallback so the
  // ladder still renders while warming or after a UW failure.
  const realRungs = (row.tile3 && Array.isArray(row.tile3.strikes))
    ? row.tile3.strikes.filter(s => s.strike >= minStrike && s.strike <= maxStrike)
                       .sort((a, b) => a.strike - b.strike)
    : [];
  const realGamma = realRungs.length >= 3;
  let strikes, gammaByStrike;
  if (realGamma) {
    strikes = realRungs.map(s => s.strike);
    gammaByStrike = realRungs.map(s => s.net_gamma);
  } else {
    strikes = [];
    for (let i = -3; i <= 3; i++) strikes.push(spot * (1 + i * 0.02));
    gammaByStrike = strikes.map(s => {
      const dist = (s - flipStrike) / spot;
      return (row.direction === "calls" ? 1 : -1) * Math.sign(dist)
           * (1 - Math.min(1, Math.abs(dist) * 30)) * 2
           + seededRand(h + Math.round(s * 100), -0.3, 0.3);
    });
  }

  // Per-view scaling: biggest |γ| in THIS view reaches ~90% of the half-track,
  // never clipping. Works for any magnitude (real γ runs to billions).
  const observedMax = Math.max(...gammaByStrike.map(g => Math.abs(g)), 1e-9);
  const maxAbsG = observedMax / 0.90;
  const halfTrack = innerW / 2 - 6;
  const xForGamma = g => centerX + (g / maxAbsG) * halfTrack;

  // Bar thickness: from the tightest real strike spacing so dense grids don't
  // overlap; the synthetic 7-strike view keeps its original even spacing.
  let barH;
  if (realGamma && strikes.length > 1) {
    let minGap = innerH;
    for (let i = 1; i < strikes.length; i++)
      minGap = Math.min(minGap, Math.abs(yForStrike(strikes[i]) - yForStrike(strikes[i - 1])));
    barH = Math.max(3, Math.min(minGap - 2, 16));
  } else {
    barH = innerH / strikes.length - 2;
  }
  const showBarLabel = barH >= 11;

  // Compact γ label for real dollar-gamma; synthetic stays in its ~±2 range.
  const fmtG = realGamma
    ? (v => { const a = Math.abs(v), s = v >= 0 ? "+" : "−";
              return a >= 1e9 ? s + (a / 1e9).toFixed(1) + "B"
                   : a >= 1e6 ? s + (a / 1e6).toFixed(0) + "M"
                   : a >= 1e3 ? s + (a / 1e3).toFixed(0) + "K" : s + a.toFixed(0); })
    : (v => (v >= 0 ? `+${v.toFixed(1)}` : v.toFixed(1)));

  let svg = "";

  // Faint full-width row guides so each strike's lane is obvious
  for (let i = 0; i < strikes.length; i++) {
    const y = yForStrike(strikes[i]);
    svg += `<rect x="${padL}" y="${(y - barH/2).toFixed(1)}" width="${innerW}" height="${barH.toFixed(1)}" fill="rgba(255,255,255,0.018)" rx="2"/>`;
  }

  // Strike bars — length ∝ |net γ|, right = long γ (blue), left = short γ (red)
  for (let i = 0; i < strikes.length; i++) {
    const s = strikes[i];
    const g = gammaByStrike[i];
    const y = yForStrike(s);
    const x = xForGamma(g);
    const isPos = g >= 0;
    const barFill = isPos
      ? "url(#ladderGradPos)"
      : "url(#ladderGradNeg)";
    const barW = Math.max(3, Math.abs(x - centerX));
    svg += `<rect x="${Math.min(centerX, x).toFixed(1)}" y="${(y - barH/2).toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${barFill}" rx="2" filter="url(#ladderBarGlow)"/>`;
    // γ value label inside the bar when wide enough, otherwise just outside —
    // suppressed on dense real-strike grids where rows are too thin to read.
    if (showBarLabel) {
      const gFmt = fmtG(g);
      const labelInside = barW >= 28;
      const labelX = labelInside
        ? (isPos ? x - 4 : x + 4)
        : (isPos ? x + 5 : x - 5);
      const labelAnchor = labelInside
        ? (isPos ? "end" : "start")
        : (isPos ? "start" : "end");
      const labelFill = labelInside ? "#FFFFFF" : "var(--axis)";
      const labelWeight = labelInside ? "700" : "400";
      svg += `<text x="${labelX.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="${labelAnchor}" fill="${labelFill}" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10" font-weight="${labelWeight}">${gFmt}</text>`;
    }
    if (showBarLabel || i % 2 === 0)
      svg += `<text x="${(padL - 6).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10">$${s.toFixed(s>100?0:2)}</text>`;
  }

  // Vertical centerline (zero γ axis)
  svg += `<line x1="${centerX}" x2="${centerX}" y1="${padT}" y2="${padT + innerH}" stroke="var(--axis)" stroke-width="0.8"/>`;
  // Axis tick marks at ±50% and ±100% of the scaled max (oriented around 0)
  const tickValues = [-maxAbsG, -maxAbsG/2, maxAbsG/2, maxAbsG];
  for (const tv of tickValues) {
    const tx = xForGamma(tv);
    svg += `<line x1="${tx.toFixed(1)}" x2="${tx.toFixed(1)}" y1="${(padT + innerH).toFixed(1)}" y2="${(padT + innerH + 4).toFixed(1)}" stroke="var(--axis)" stroke-width="0.6"/>`;
    svg += `<text x="${tx.toFixed(1)}" y="${(padT + innerH + 13).toFixed(1)}" text-anchor="middle" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9">${fmtG(tv)}</text>`;
  }
  svg += `<text x="${centerX}" y="${padT + innerH + 13}" text-anchor="middle" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9">0</text>`;
  // Left & right axis labels
  svg += `<text x="${padL + 4}" y="${padT + 10}" text-anchor="start" fill="var(--neg)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9" font-weight="600">◀ short γ</text>`;
  svg += `<text x="${padL + innerW - 4}" y="${padT + 10}" text-anchor="end" fill="var(--pos)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9" font-weight="600">long γ ▶</text>`;

  // Spot line (orange solid)
  const ys = yForStrike(spot);
  svg += `<line x1="${padL}" x2="${padL + innerW}" y1="${ys}" y2="${ys}" stroke="var(--warn)" stroke-width="2"/>`;
  svg += `<text x="${padL + innerW + 6}" y="${ys + 4}" fill="var(--warn)" font-family="ui-monospace,monospace" font-size="11" font-weight="700">SPOT $${spot.toFixed(spot > 100 ? 0 : 2)}</text>`;

  // Gamma flip line (purple dashed) — suppressed when there's no flip in range.
  if ((row.gex_status || "ok") !== "no_flip") {
    const yf = yForStrike(flipStrike);
    svg += `<line x1="${padL}" x2="${padL + innerW}" y1="${yf}" y2="${yf}" stroke="var(--hot)" stroke-width="1.5" stroke-dasharray="4,3"/>`;
    svg += `<text x="${padL + innerW + 6}" y="${yf + 4}" fill="var(--hot)" font-family="ui-monospace,monospace" font-size="11" font-weight="700">FLIP $${flipStrike.toFixed(flipStrike > 100 ? 0 : 2)}</text>`;
  }

  // Wall callouts (call wall above, put wall below) — labels on RIGHT side now that we have width
  const yCW = yForStrike(callWallStrike);
  const yPW = yForStrike(putWallStrike);
  if (yCW >= padT && yCW <= padT + innerH) {
    svg += `<line x1="${padL}" x2="${padL + innerW}" y1="${yCW}" y2="${yCW}" stroke="var(--pos)" stroke-width="1" stroke-dasharray="2,3" opacity="0.7"/>`;
    svg += `<text x="${padL + innerW + 6}" y="${yCW + 4}" fill="var(--pos)" font-family="ui-monospace,monospace" font-size="10">CALL WALL $${callWallStrike.toFixed(callWallStrike > 100 ? 0 : 2)}</text>`;
  }
  if (yPW >= padT && yPW <= padT + innerH) {
    svg += `<line x1="${padL}" x2="${padL + innerW}" y1="${yPW}" y2="${yPW}" stroke="var(--neg)" stroke-width="1" stroke-dasharray="2,3" opacity="0.7"/>`;
    svg += `<text x="${padL + innerW + 6}" y="${yPW + 4}" fill="var(--neg)" font-family="ui-monospace,monospace" font-size="10">PUT WALL $${putWallStrike.toFixed(putWallStrike > 100 ? 0 : 2)}</text>`;
  }

  return svg;
}

/* ============================================================
 * Tile 3 Phase 2 — rich on-demand gamma map (2× footprint):
 * OI/Vol toggle, expiry tabs, diverging call/put ladder (scale-fixed),
 * structural levels + charm/vanna drift. Fed by /api/tile3/{ticker}.
 * ============================================================ */

function renderTile3Rich(row, detail) {
  const g = row.gates.structural;
  const spot = detail.spot || row.spot;
  let expiry = state.tile3Expiry;
  if (!expiry || !detail.views[expiry]) expiry = detail.default_expiry;
  const view = detail.views[expiry] || Object.values(detail.views)[0];
  if (!view) return renderTile3Structural(row);
  const w = state.tile3Weighting === "vol" ? "vol" : "oi";

  const short = view.regime === "short";
  const bannerHead = short ? "TREND — moves amplified" : "PIN — moves dampened";
  const flipStrike = spot * (1 + (view.flip_pct || 0) / 100);
  const flipNear = view.flip_status === "ok" && Math.abs(view.flip_pct || 0) <= 9;
  const sentence = short
    ? `Dealers are <strong>short γ</strong> here — breakouts have fuel. ${flipNear ? `γ flip ${view.flip_pct >= 0 ? "above" : "below"} spot at $${flipStrike.toFixed(0)}.` : "No γ flip in the near range."}`
    : `Dealers are <strong>long γ</strong> — moves get dampened, price pins. ${flipNear ? `Flip at $${flipStrike.toFixed(0)} (${view.flip_pct.toFixed(1)}%).` : "Flip is out of the near range."}`;

  const wBtn = (val, label) => `<button class="t3-tog ${w === val ? "on" : ""}" onclick="setTile3Weighting('${val}')">${label}</button>`;
  const expTabs = Object.entries(detail.views).map(([e, v]) =>
    `<button class="t3-tog ${e === expiry ? "on" : ""}" onclick="setTile3Expiry('${e}')">${v.label} <span class="t3-tag">${v.tag}</span></button>`).join("");

  const flipVal = view.flip_status === "ok"
    ? `$${flipStrike.toFixed(2)} (${view.flip_pct >= 0 ? "+" : ""}${view.flip_pct.toFixed(1)}%)`
    : "none in ±9%";
  const lvl = (lbl, val, cls) => `<div class="t3-lvl ${cls || ""}"><span class="l">${lbl}</span><span class="v">${val}</span></div>`;
  const levels = `
    ${lvl("Call wall", view.call_wall != null ? `$${view.call_wall.toFixed(2)}` : "—", "up")}
    ${lvl("γ Flip", flipVal, "flip")}
    ${lvl("Spot", `$${spot.toFixed(2)}`, "spot")}
    ${lvl("Put wall", view.put_wall != null ? `$${view.put_wall.toFixed(2)}` : "—", "dn")}`;

  let drift = "";
  if (detail.drift_available) {
    drift = `<div class="t3-drift">
      <div class="t3-drift-h">DRIFT · ${view.dte}DTE</div>
      ${driftGauge("Charm · time pull", view.charm)}
      ${driftGauge("Vanna · vol pull", view.vanna)}
    </div>`;
  }

  return `
    <h3>
      <span><span class="gate-dot ${g}"></span>Tile 3: Structural Setup</span>
      <button class="help-icon" data-help="tile3">?</button>
    </h3>
    <div class="t3-banner ${short ? "short" : "long"}">
      <div class="t3-banner-h">${bannerHead}</div>
      <div class="t3-banner-s">${sentence}</div>
    </div>
    <div class="t3-controls">
      <div class="t3-grp"><span class="t3-grp-l">Weighting</span>${wBtn("oi", "Open interest")}${wBtn("vol", "Volume")}</div>
      <div class="t3-grp t3-grp-exp"><span class="t3-grp-l">Expiry</span>${expTabs}</div>
    </div>
    <div class="t3-body">
      <div class="t3-ladder">${richLadderSvg(view, w, spot)}</div>
      <div class="t3-side">
        <div class="t3-levels">${levels}</div>
        ${drift}
      </div>
    </div>
    <div class="t3-howto">
      Bars: <strong style="color:var(--pos)">right = call γ</strong> (resistance / ceiling) · <strong style="color:var(--neg)">left = put γ</strong> (support / floor). Taller = dealers defend it harder. The <span style="color:var(--hot)">flip</span> is where the regime switches. Flip to <strong>Volume</strong> for today's build; switch <strong>expiry</strong> — the regime can differ week to week.
      <div class="t3-prov">🔵 LIVE · spot-exposures/expiry-strike + greek-exposure/expiry · real-time structural snapshot, not a forecast.</div>
    </div>`;
}

function driftGauge(label, d) {
  const dir = (d && d.dir) || "flat";
  const mag = Math.sqrt(Math.min(1, Math.abs((d && d.value) || 0) / 1e9));
  const pct = Math.max(5, Math.round(mag * 100));
  const up = dir.indexOf("up") === 0;
  const cls = up ? "up" : dir === "down" ? "dn" : "";
  const arrow = up ? "▲" : dir === "down" ? "▼" : "•";
  const note = dir === "up_if_iv_rises" ? "up if IV rises"
    : dir === "up_if_iv_falls" ? "up if IV falls"
    : dir === "up" ? "upward as time passes"
    : dir === "down" ? "downward as time passes" : "neutral";
  return `<div class="t3-gauge"><span class="g-l">${label}</span><span class="g-bar"><span class="g-fill ${cls}" style="width:${pct}%"></span></span><span class="g-n ${cls}">${arrow} ${note}</span></div>`;
}

function richLadderSvg(view, w, spot) {
  const rungs = (view[w] || []).slice().sort((a, b) => a.strike - b.strike);
  if (rungs.length < 2) {
    return `<div style="display:flex;align-items:center;justify-content:center;height:340px;color:var(--axis);font-size:12px;">No strike-level γ in this expiry/weighting.</div>`;
  }
  const W = 720, H = 340, padT = 18, padB = 26, padL = 78, padR = 120;
  const innerH = H - padT - padB, innerW = W - padL - padR;
  const minK = rungs[0].strike, maxK = rungs[rungs.length - 1].strike;
  const span = (maxK - minK) || 1;
  // Scale fix: y maps strikes over the ACTUAL rung range (tight — no dead space).
  const yFor = k => padT + innerH * (1 - (k - minK) / span);
  const centerX = padL + innerW / 2;
  const half = innerW / 2 - 8;
  let maxG = 0;
  for (const r of rungs) maxG = Math.max(maxG, Math.abs(r.call_gamma || 0), Math.abs(r.put_gamma || 0));
  maxG = (maxG || 1) / 0.92;
  const barH = Math.max(3, Math.min(innerH / rungs.length - 2, 13));
  const fmtG = v => { const a = Math.abs(v), s = v >= 0 ? "" : "−"; return a >= 1e9 ? s + (a / 1e9).toFixed(1) + "B" : a >= 1e6 ? s + Math.round(a / 1e6) + "M" : a >= 1e3 ? s + Math.round(a / 1e3) + "K" : s + Math.round(a); };

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:340px;display:block;">
    <defs>
      <linearGradient id="rlPos" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.55"/><stop offset="100%" stop-color="#7AA2F7" stop-opacity="1"/></linearGradient>
      <linearGradient id="rlNeg" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#F7768E" stop-opacity="0.55"/><stop offset="100%" stop-color="#F7768E" stop-opacity="1"/></linearGradient>
    </defs>`;
  // strike lane guides + bars
  const labelEvery = Math.ceil(rungs.length / 12);
  for (let i = 0; i < rungs.length; i++) {
    const r = rungs[i], y = yFor(r.strike);
    svg += `<rect x="${padL}" y="${(y - barH / 2).toFixed(1)}" width="${innerW}" height="${barH.toFixed(1)}" fill="rgba(255,255,255,0.015)" rx="2"/>`;
    const cw = Math.max(0, Math.abs(r.call_gamma || 0) / maxG * half);
    const pw = Math.max(0, Math.abs(r.put_gamma || 0) / maxG * half);
    if (cw > 0.5) svg += `<rect x="${centerX.toFixed(1)}" y="${(y - barH / 2).toFixed(1)}" width="${cw.toFixed(1)}" height="${barH.toFixed(1)}" fill="url(#rlPos)" rx="2"/>`;
    if (pw > 0.5) svg += `<rect x="${(centerX - pw).toFixed(1)}" y="${(y - barH / 2).toFixed(1)}" width="${pw.toFixed(1)}" height="${barH.toFixed(1)}" fill="url(#rlNeg)" rx="2"/>`;
    if (i % labelEvery === 0)
      svg += `<text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10">$${r.strike.toFixed(r.strike > 100 ? 0 : 2)}</text>`;
  }
  // center axis + side labels
  svg += `<line x1="${centerX}" x2="${centerX}" y1="${padT}" y2="${padT + innerH}" stroke="var(--axis)" stroke-width="0.8"/>`;
  svg += `<text x="${padL + 4}" y="${padT - 5}" fill="var(--neg)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9" font-weight="600">◀ put γ (floor)</text>`;
  svg += `<text x="${padL + innerW - 4}" y="${padT - 5}" text-anchor="end" fill="var(--pos)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9" font-weight="600">call γ (ceiling) ▶</text>`;
  svg += `<text x="${centerX}" y="${padT + innerH + 16}" text-anchor="middle" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9">peak γ ≈ ${fmtG(maxG * 0.92)}</text>`;
  // level lines (only when within the rung range)
  const line = (k, color, dash, label) => {
    if (k == null || k < minK || k > maxK) return "";
    const y = yFor(k);
    return `<line x1="${padL}" x2="${padL + innerW}" y1="${y}" y2="${y}" stroke="${color}" stroke-width="${dash ? 1.3 : 2}" ${dash ? `stroke-dasharray="${dash}"` : ""}/>` +
      `<text x="${padL + innerW + 6}" y="${(y + 4).toFixed(1)}" fill="${color}" font-family="ui-monospace,monospace" font-size="10" font-weight="700">${label} $${k.toFixed(k > 100 ? 0 : 2)}</text>`;
  };
  svg += line(spot, "var(--warn)", "", "SPOT");
  if (view.flip_status === "ok") svg += line(spot * (1 + (view.flip_pct || 0) / 100), "var(--hot)", "4,3", "FLIP");
  svg += line(view.call_wall, "var(--pos)", "2,3", "CALL WALL");
  svg += line(view.put_wall, "var(--neg)", "2,3", "PUT WALL");
  svg += `</svg>`;
  return svg;
}

/* ============================================================
 * Task 12: Tile 4 — Cost & Timing (IVR gauge + v2.2 curve shape)
 * ============================================================ */

function renderTile4Cost(row) {
  const g = row.gates.cost;
  const ivr = row.ivr;
  const needlePct = Math.max(0, Math.min(100, ivr));
  const earnDays = row.days_to_earnings;
  let earnLabel, earnStatus;
  if (earnDays === null) { earnLabel = "no scheduled earnings"; earnStatus = "gray"; }
  else if (earnDays < CALIBRATION.earnings_days_min) { earnLabel = `${earnDays}d (within 7d window — FAIL)`; earnStatus = "red"; }
  else { earnLabel = `${earnDays}d`; earnStatus = "green"; }

  // v2.2 curve shape
  const cs = ivCurveShape(row);
  const c = row.iv_term_curve;
  let curveLabel, curveClass, curveTooltipKey;
  if (cs.shape === "severe_inverted") {
    curveLabel = `Curve shape: INVERTED ↘ — front-month IV is elevated vs. back months`;
    curveClass = "severe";
    curveTooltipKey = "curve_shape";
  } else if (cs.shape === "mild_inverted") {
    curveLabel = `Curve shape: Inverted ↘`;
    curveClass = "mild";
    curveTooltipKey = "curve_shape";
  } else {
    curveLabel = `Curve shape: Normal ↗`;
    curveClass = "normal";
    curveTooltipKey = "curve_shape_normal";
  }
  const ivsDetail = c
    ? `<span class="ivs">front-month at <strong>${(c[0]*100).toFixed(0)} IV</strong>, back at <strong>${(c[c.length-1]*100).toFixed(0)}</strong></span>`
    : "";

  return `
    <h3>
      <span><span class="gate-dot ${g}"></span>Tile 4: Cost & Timing</span>
      <button class="help-icon" data-help="tile4">?</button>
    </h3>
    <div style="font-family:var(--ff-mono); font-size:11px; color:var(--axis);">
      IV rank: <span style="color:var(--title); font-weight:600;">${ivr.toFixed(0)}</span> ${pill("live")}
    </div>
    <div class="ivr-gauge">
      <div class="zone green"></div>
      <div class="zone yellow"></div>
      <div class="zone red"></div>
      <div class="needle" style="left: ${needlePct}%;"></div>
    </div>
    <div class="ivr-axis"><span>0</span><span>60</span><span>80</span><span>100</span></div>
    <div class="earnings-line">
      <span class="indicator ${earnStatus}"></span>
      Days until next earnings: <strong>${earnLabel}</strong>
    </div>
    <div class="curve-line ${curveClass}" data-tooltip-trigger="${curveTooltipKey}">
      ${curveLabel}
    </div>
    ${renderTermStructureChart(row, curveClass)}
    ${renderCurveInsight(row, cs)}
  `;
}

/* 1-sentence term-structure insight. Prefer Gemini prose from the snapshot
 * (row.insights.curve); fall back to deterministic template on miss. */
function renderCurveInsight(row, cs) {
  if (row.insights && row.insights.curve) {
    return `
      <div class="insight" data-llm="gemini">
        <div class="label">chart insight · Gemini</div>
        ${row.insights.curve}
      </div>
    `;
  }
  const c = row.iv_term_curve;
  if (!c || c.length < 2) return "";
  const front = (c[0] * 100).toFixed(0);
  const back = (c[c.length - 1] * 100).toFixed(0);
  let body;
  if (cs.shape === "severe_inverted") {
    body = `Front-month IV (<strong>${front}</strong>) is <em>${cs.spread_pts.toFixed(1)} vol points</em> hotter than back (<strong>${back}</strong>) — market is pricing a near-term event, so this-week options are over-priced relative to next-week.`;
  } else if (cs.shape === "mild_inverted") {
    body = `Mild front-month premium (<strong>${front}</strong> vs <strong>${back}</strong>) — a near-term catalyst is being priced in but not aggressively; check Tile 6 cost/day before committing.`;
  } else {
    body = `Normal upward curve (<strong>${front}</strong> → <strong>${back}</strong>) — no near-term vol premium; standard expiration selection applies.`;
  }
  return `
    <div class="insight" data-llm-future="tile4_curve_insight">
      <div class="label">chart insight · pre-wired Gemini call</div>
      ${body}
    </div>
  `;
}

/* IV term-structure sparkline: plots 7d/14d/30d/60d implied vol so the curve
 * shape is visually obvious (inverted → downward slope, normal → upward slope).
 * Color follows the curve-shape class (red/orange/green). */
function renderTermStructureChart(row, curveClass) {
  const curve = row.iv_term_curve;
  if (!curve || curve.length < 2) {
    return `<div style="margin-top:8px; font-size:10px; color:var(--axis); font-family:var(--ff-mono);">No term-structure data on this row.</div>`;
  }
  // Standard expiration ladder we assume the array corresponds to
  const DTES = [7, 14, 30, 60];
  const W = 320, H = 110;
  const padL = 36, padR = 12, padT = 10, padB = 22;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const minIV = Math.min(...curve) * 0.94;
  const maxIV = Math.max(...curve) * 1.06;
  const ivRange = maxIV - minIV || 0.01;
  const lineColor = curveClass === "severe" ? "var(--neg)"
                   : curveClass === "mild"  ? "var(--warn)"
                   : "var(--ok)";
  const glow = curveClass === "severe" ? "var(--neg-glow)"
              : curveClass === "mild"  ? "var(--warn-glow)"
              : "var(--ok-glow)";
  const xFor = i => padL + (innerW * i) / Math.max(1, curve.length - 1);
  const yFor = v => padT + innerH * (1 - (v - minIV) / ivRange);
  const points = curve.map((v, i) => `${xFor(i).toFixed(1)},${yFor(v).toFixed(1)}`);
  const polyline = `<polyline points="${points.join(" ")}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" filter="drop-shadow(0 0 3px ${glow})"/>`;
  // Area under the line for visual weight
  const areaPts = [...points];
  areaPts.push(`${xFor(curve.length - 1).toFixed(1)},${(padT + innerH).toFixed(1)}`);
  areaPts.push(`${padL.toFixed(1)},${(padT + innerH).toFixed(1)}`);
  const area = `<polygon points="${areaPts.join(" ")}" fill="${lineColor}" opacity="0.10"/>`;
  // Dots + labels at each point
  const dots = curve.map((v, i) => {
    const cx = xFor(i), cy = yFor(v);
    const ivPct = (v * 100).toFixed(0);
    const dteLabel = DTES[i] !== undefined ? `${DTES[i]}d` : "";
    return `
      <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3" fill="${lineColor}" stroke="var(--bg-2)" stroke-width="1.5"/>
      <text x="${cx.toFixed(1)}" y="${(cy - 8).toFixed(1)}" text-anchor="middle" fill="var(--title)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10" font-weight="600">${ivPct}</text>
      <text x="${cx.toFixed(1)}" y="${(padT + innerH + 14).toFixed(1)}" text-anchor="middle" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9">${dteLabel}</text>
    `;
  }).join("");
  // Y-axis label
  const yLabel = `<text x="${(padL - 8).toFixed(1)}" y="${(padT + innerH/2 + 3).toFixed(1)}" text-anchor="end" fill="var(--axis)" font-family="JetBrains Mono,ui-monospace,monospace" font-size="9">IV %</text>`;
  return `
    <div class="term-chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:110px;display:block;">
        <line x1="${padL}" x2="${padL}" y1="${padT}" y2="${padT + innerH}" stroke="var(--grid)" stroke-width="0.6"/>
        <line x1="${padL}" x2="${padL + innerW}" y1="${padT + innerH}" y2="${padT + innerH}" stroke="var(--grid)" stroke-width="0.6"/>
        ${area}
        ${polyline}
        ${dots}
        ${yLabel}
      </svg>
    </div>
  `;
}

/* ============================================================
 * Task 13: Tile 5 — Confirmation Stack (2 badges, no gate dot)
 * ============================================================ */

function renderTile5Confirmation(row) {
  // No gate dot — Tile 5 is tiebreaker, not a gate
  const isSynth = row.is_synthetic;

  // ── Sector tide ─────────────────────────────────────────────────────────
  const sectorName = isSynth ? row.sector : "broad-market ETF";
  const tideVal = isSynth
    ? row.sector_tide_value
    : (row.gates.flow === "green" ? 0.34 : row.gates.flow === "red" ? -0.34 : 0.08);
  const tideAbs = Math.abs(tideVal);
  const tideStatus = tideAbs > CALIBRATION.sector_tide_green_abs
    ? (tideVal > 0 ? "green" : "red")
    : (tideAbs > 0.12 ? "yellow" : "gray");
  const tideDir = tideVal > 0 ? "bullish" : tideVal < 0 ? "bearish" : "flat";
  const tradeDir = row.direction === "calls" ? "calls" : "puts";
  const tideAgrees = (row.direction === "calls" && tideVal > 0) || (row.direction === "puts" && tideVal < 0);
  const sectorPill = isSynth ? pill("live") : pill("proxy");

  // ── News headlines ──────────────────────────────────────────────────────
  const newsItems = isSynth ? (row.news_items || []) : [];
  const newsCount = newsItems.length;
  const newsStatus = newsCount === 0 ? "gray" : newsCount >= 3 ? "yellow" : "green";

  // ── Dark pool ───────────────────────────────────────────────────────────
  let dpNet, dpPct, dpTrend;
  if (isSynth) {
    dpNet = row.dark_pool.net_premium_usd;
    dpPct = row.dark_pool.pct_of_volume;
    dpTrend = row.dark_pool.trend;
  } else {
    dpNet = row.dp_net_premium_usd || 0;
    // % of volume is PROXY — UW Basic doesn't give consolidated volume here.
    // Synthesize a plausible value deterministically.
    const h = strHash(row.ticker);
    dpPct = Math.round(seededRand(h * 7, 12, 38));
    dpTrend = dpNet > 0 ? "buying" : dpNet < 0 ? "selling" : "neutral";
  }
  const dpAbs = Math.abs(dpNet);
  const dpFmt = dpAbs >= 1e9
    ? `${(dpNet / 1e9).toFixed(2)}B`
    : dpAbs >= 1e6
      ? `${(dpNet / 1e6).toFixed(1)}M`
      : `${Math.round(dpNet / 1e3)}k`;
  const dpSign = dpNet > 0 ? "+" : dpNet < 0 ? "" : "";  // negative number already has -
  const dpAgrees = (row.direction === "calls" && dpNet > 0) || (row.direction === "puts" && dpNet < 0);
  const dpStatus = dpAbs < 500_000
    ? "gray"
    : (dpAgrees ? "green" : "red");
  const dpNetPill = isSynth ? pill("live") : pill("live");
  const dpPctPill = pill("proxy");

  // ── News items HTML ─────────────────────────────────────────────────────
  const newsHtml = newsCount === 0
    ? `<div class="empty">No headlines in last 24h.</div>`

        <div class="sec-row">
          <span class="time">${n.time}</span>
          <span class="src">${n.source}</span>
          <span class="head">${n.headline}</span>

  // Friendly tide caption
  const tideCaption = isSynth
    ? `${sectorName} sector — ${tideDir} ${(tideVal >= 0 ? "+" : "")}${tideVal.toFixed(2)} · ${tideAgrees ? "agrees with " + tradeDir : "fights " + tradeDir}`
    : `derived from flow gate — no per-ticker sector mapping on Basic tier`;

  return `
    <h3>
      <span>Tile 5: Confirmation Stack <span style="color:var(--axis); font-size:10px; font-weight:400;">(tiebreakers — not gates)</span></span>
      <button class="help-icon" data-help="tile5">?</button>
    </h3>
    <div class="confirm-row">
      <div class="confirm-badge"><span class="dot ${tideStatus}"></span> Sector tide ${(tideVal >= 0 ? "+" : "")}${tideVal.toFixed(2)}</div>
      <div class="confirm-badge"><span class="dot ${newsStatus}"></span> News (${newsCount} ${newsCount === 1 ? "headline" : "headlines"})</div>
      <div class="confirm-badge"><span class="dot ${dpStatus}"></span> Dark pool ${dpSign}$${dpFmt}</div>
    </div>

    <div class="confirm-detail">
      <div class="confirm-section">
        <div class="sec-head"><span class="title">Sector Tide</span><span>${sectorName.toUpperCase()}</span></div>
        <div class="sec-value ${tideVal > 0 ? "pos" : tideVal < 0 ? "neg" : ""}">
          ${(tideVal >= 0 ? "+" : "")}${tideVal.toFixed(2)}
          <span class="sub">${tideDir}</span>
        </div>
        <div style="margin-top:6px; font-size:10px; color:var(--axis); line-height:1.4;">
          ${tideCaption}
        </div>
      </div>

      <div class="confirm-section">
        <div class="sec-head"><span class="title">News (24h)</span><span>${newsCount}</span></div>
        ${newsHtml}
      </div>

      <div class="confirm-section">
        <div class="sec-head"><span class="title">Dark Pool</span><span>${dpTrend.toUpperCase()}</span></div>
        <div class="sec-value ${dpNet > 0 ? "pos" : dpNet < 0 ? "neg" : ""}">
          ${dpSign}$${dpFmt}
          <span class="sub">net premium</span>
        </div>
        <div style="margin-top:6px; display:flex; justify-content:space-between; align-items:baseline; font-size:10px;">
          <span style="color:var(--axis);">${dpPct}% of consolidated vol</span>
          <span style="color:var(--axis);">${dpAgrees ? "agrees with " + tradeDir : dpAbs < 500_000 ? "no signal" : "fights " + tradeDir}</span>
        </div>
      </div>
    </div>
  `;
}

/* ============================================================
 * Task 14: Tile 6 — Contract Picker (v2.1 structural + v2.2 cost/day)
 * ============================================================ */

/* Annotate a strike based on its position relative to spot, flip, walls. Returns
 * {label, class} where label is the short Structure-column text and class is
 * an optional row class (e.g. "unfavorable", "itm"). */
function annotateStrike(strike, spot, flipStrike, callWall, putWall, direction) {
  const isCall = direction === "calls";
  const dirWall = isCall ? callWall : putWall;
  const oppWall = isCall ? putWall : callWall;
  const oppWallPct = Math.abs(oppWall - spot) / spot * 100;
  const onFlip = Math.abs(strike - flipStrike) / spot < 0.005;  // within 0.5% of flip
  const onDirWall = Math.abs(strike - dirWall) / spot < 0.005;
  const pastDirWall = isCall ? strike > dirWall : strike < dirWall;
  const isITM = isCall ? strike < spot : strike > spot;
  const favorableSide = isCall ? strike > flipStrike : strike < flipStrike;

  // ITM with opposing wall providing floor (within X% in opposite direction — calibrated)
  if (isITM && oppWallPct <= CALIBRATION.protected_itm_opp_wall_pct) {
    return {label: `ITM · floor at $${oppWall.toFixed(strike < 100 ? 2 : 0)}`, class: "itm"};
  }
  // Strike on the γ flip
  if (onFlip) return {label: "at γ flip", class: ""};
  // Past directional wall (TREND/breakout target)
  if (pastDirWall) return {label: "past wall", class: ""};
  // On the directional wall
  if (onDirWall) return {label: "at wall", class: ""};
  // Between flip (on favorable side) and directional wall = clear path
  const betweenFlipAndWall = favorableSide && (isCall ? strike < dirWall : strike > dirWall);
  if (betweenFlipAndWall) return {label: "clear path", class: ""};
  // On the unfavorable side of flip
  if (!favorableSide && !isITM) return {label: "below flip — unfavorable", class: "unfavorable"};
  // Default: thin γ zone (no nearby structural feature)
  return {label: "thin γ zone", class: ""};
}

/* Pick the structurally-optimal strike per the spec table. Returns
 * {strike, reason, recommend}. */
function pickRecommendedStrike(row, candidates, spot, flipStrike, callWall, putWall, structurallyProtectedITM) {
  const isCall = row.direction === "calls";
  const dirWall = isCall ? callWall : putWall;
  const gate3 = row.gates.structural;
  // Gate 3 RED: don't recommend; just default to ATM with warning
  if (gate3 === "red") {
    const atm = candidates.reduce((best, c) => Math.abs(c - spot) < Math.abs(best - spot) ? c : best, candidates[0]);
    const pickIsITM = isCall ? atm < spot : atm > spot;
    const reason = (structurallyProtectedITM && pickIsITM)
      ? "STRUCTURE FAILS · ITM floor only weak hedge"
      : "STRUCTURE FAILS";
    return {strike: atm, reason, recommend: false};
  }
  // Gate 3 YELLOW: ATM, no structural edge (unless opposing wall provides a floor)
  if (gate3 === "yellow") {
    const atm = candidates.reduce((best, c) => Math.abs(c - spot) < Math.abs(best - spot) ? c : best, candidates[0]);
    const pickIsITM = isCall ? atm < spot : atm > spot;
    const reason = (structurallyProtectedITM && pickIsITM)
      ? "ATM with wall floor"
      : "no structural edge";
    return {strike: atm, reason, recommend: true};
  }
  // Gate 3 GREEN — pick by setup type
  const flipFar = Math.abs(row.flip_dist_pct) > 3;
  const wallCloseInDir = isCall ? row.wall_up_dist_pct < 1.5 : row.wall_dn_dist_pct < 1.5;
  // TREND / breakout: flip far AND wall close in direction → just past wall
  if (flipFar && wallCloseInDir) {
    const past = candidates.filter(c => isCall ? c > dirWall : c < dirWall);
    const pick = past.length > 0
      ? past.reduce((best, c) => Math.abs(c - dirWall) < Math.abs(best - dirWall) ? c : best, past[0])
      : candidates[0];
    return {strike: pick, reason: "past wall (breakout)", recommend: true};
  }
  // Squeeze: flip close AND favorable AND no wall obstruction → at flip
  const flipFavorable = isCall ? row.flip_dist_pct < 0 : row.flip_dist_pct > 0;
  if (Math.abs(row.flip_dist_pct) < 1.0 && flipFavorable && !wallCloseInDir) {
    const onFlip = candidates.reduce((best, c) => Math.abs(c - flipStrike) < Math.abs(best - flipStrike) ? c : best, candidates[0]);
    return {strike: onFlip, reason: "at γ flip (regime transition)", recommend: true};
  }
  // Default PIN (flip favorable, near spot, wall reasonable distance): clear path
  const clearPath = candidates.filter(c => {
    const favSide = isCall ? c > flipStrike : c < flipStrike;
    const beforeWall = isCall ? c < dirWall : c > dirWall;
    return favSide && beforeWall;
  });
  const pick = clearPath.length > 0
    ? clearPath.reduce((best, c) => Math.abs(c - spot) < Math.abs(best - spot) ? c : best, clearPath[0])
    : candidates[0];
  return {strike: pick, reason: "clear path", recommend: true};
}

function renderTile6Picker(row) {
  const isCall = row.direction === "calls";
  const spot = row.spot;
  // Expirations carry both label and DTE for cost/day computation
  const EXPIRATIONS = {
    thisFri: {label: "This Fri", dte: 5},
    nextFri: {label: "Next Fri", dte: 8},
    twoWk:   {label: "Two Wks",  dte: 12},
  };
  const strikeStep = spot < 20 ? 0.5 : spot < 100 ? 1 : spot < 500 ? 5 : 25;
  const atmStrike = Math.round(spot / strikeStep) * strikeStep;
  const h = strHash(row.ticker);

  // Structural context (from Tile 3 data already normalized onto the row)
  const flipStrike = spot * (1 + row.flip_dist_pct / 100);
  const callWall = spot * (1 + row.wall_up_dist_pct / 100);
  const putWall = spot * (1 - row.wall_dn_dist_pct / 100);
  const oppWallPct = isCall ? row.wall_dn_dist_pct : row.wall_up_dist_pct;
  const structurallyProtectedITM = oppWallPct <= CALIBRATION.protected_itm_opp_wall_pct;

  // Candidate strikes
  let candidates;
  if (structurallyProtectedITM) {
    candidates = isCall
      ? [atmStrike - strikeStep * 2, atmStrike - strikeStep, atmStrike, atmStrike + strikeStep, atmStrike + strikeStep * 2]
      : [atmStrike + strikeStep * 2, atmStrike + strikeStep, atmStrike, atmStrike - strikeStep, atmStrike - strikeStep * 2];
  } else {
    candidates = isCall
      ? [atmStrike, atmStrike + strikeStep, atmStrike + strikeStep * 2, atmStrike + strikeStep * 3]
      : [atmStrike, atmStrike - strikeStep, atmStrike - strikeStep * 2, atmStrike - strikeStep * 3];
  }

  // v2.1 — pick the strike via the structural selector
  const pick = pickRecommendedStrike(row, candidates, spot, flipStrike, callWall, putWall, structurallyProtectedITM);

  // v2.2 — pick the expiration via the cost/day logic.
  // When curve is inverted, longer expirations are cheaper per day. Shift the
  // recommended expiration to two-week if its cost/day is < 70% of this-week's.
  const curveShape = ivCurveShape(row).shape;

  // Synthesize a mid price for a given strike + DTE — used both for the table
  // row pricing AND for the cost/day expiration selector. Front-month gets a
  // premium boost when the curve is inverted (so cost/day differential shows up).
  function synthMid(seed, strike, dte) {
    const baseBid = seededRand(seed + Math.round(strike * 10), 0.8, 4.5);
    const baseAsk = baseBid + seededRand(seed + 1 + Math.round(strike * 10), 0.05, 0.20);
    let mid = (baseBid + baseAsk) / 2;
    // Inverted curve front-month premium boost
    if (curveShape !== "normal" && dte <= 5) {
      const spread_pts = ivCurveShape(row).spread_pts;
      const boost = 1 + (spread_pts / 100) * 0.6;  // proportional to inversion severity
      mid *= boost;
    }
    return mid;
  }

  let recommendedExp = "nextFri";  // default
  if (curveShape !== "normal") {
    // Compute cost/day at the recommended strike across all three expirations
    const costs = {};
    for (const expKey of Object.keys(EXPIRATIONS)) {
      const mid = synthMid(h, pick.strike, EXPIRATIONS[expKey].dte);
      costs[expKey] = mid / EXPIRATIONS[expKey].dte;
    }
    const minCostKey = costs.twoWk < costs.nextFri ? "twoWk" : "nextFri";
    // Shift recommendation only if the cheaper longer-dated expiration is materially cheaper per day
    if (costs[minCostKey] < costs.thisFri * 0.70) recommendedExp = minCostKey;
  }

  function pricedRow(strike, expKey, isRecommended, customReason) {
    const exp = EXPIRATIONS[expKey];
    const mid = synthMid(h, strike, exp.dte);
    // Minor #10: seed on (strike, dte) so this-week vs two-week toggle rows show
    // differentiated bid/ask/vol/OI, not identical-except-mid values
    const bid = mid - seededRand(h + 9 + Math.round(strike * 10) + exp.dte, 0.05, 0.15);
    const ask = mid + seededRand(h + 10 + Math.round(strike * 10) + exp.dte, 0.05, 0.15);
    const vol = Math.round(seededRand(h + 2 + Math.round(strike * 10) + exp.dte, 1000, 12000));
    const oi = Math.round(seededRand(h + 3 + Math.round(strike * 10) + exp.dte, 3000, 18000));
    const spread = ((ask - bid) / mid * 100).toFixed(1);
    const costPerDay = (mid / exp.dte).toFixed(2);
    const ann = isRecommended && customReason
      ? {label: customReason, class: ""}
      : annotateStrike(strike, spot, flipStrike, callWall, putWall, row.direction);
    const rowClasses = [isRecommended ? "recommended" : "", ann.class].filter(Boolean).join(" ");
    const marker = isRecommended ? " ← recommended" : "";
    return `<tr class="${rowClasses}">
      <td>$${strike}</td>
      <td>${exp.label}</td>
      <td>${bid.toFixed(2)}×${ask.toFixed(2)}</td>
      <td>${mid.toFixed(2)}</td>
      <td>$${costPerDay}/day</td>
      <td>${vol.toLocaleString()}</td>
      <td>${oi.toLocaleString()}</td>
      <td>${spread}%</td>
      <td class="structure-cell">${ann.label}${marker}</td>
    </tr>`;
  }

  // Build rows: for each candidate strike, show ONE row at the chosen expiration.
  const mainRows = candidates.map(c => {
    const isRec = c === pick.strike;
    const expKey = isRec ? recommendedExp : "nextFri";
    return pricedRow(c, expKey, isRec, isRec ? pick.reason : null);
  }).join("");

  const gate3FailWarning = !pick.recommend
    ? `<tr class="gate3-fail-warning"><td colspan="9">⚠ Gate 3 fails — picker does not recommend a strike for this setup</td></tr>`
    : "";

  // This-week toggle shows the recommended strike at both this-week and two-week
  const thisWeek = state.contractPickerShowThisWeek
    ? [pricedRow(pick.strike, "thisFri", false, null),
       pricedRow(pick.strike, "twoWk", false, null)].join("")
    : "";

  const divider = state.contractPickerShowThisWeek
    ? `<tr><td colspan="9" class="picker-divider" id="picker-toggle">─── Hide this-week / two-week comparison ───</td></tr>`
    : `<tr><td colspan="9" class="picker-divider" id="picker-toggle">─── Compare this-week / two-week (toggle to show cost/day across expirations) ───</td></tr>`;

  // Footer note adjusts based on curve shape
  const footer = curveShape !== "normal"
    ? `Curve inverted — exp shifted to <strong style="color:var(--text);">${EXPIRATIONS[recommendedExp].label}</strong> (cheaper per day).`
    : `Strike chosen for structure (Tile 3 γ), not generic ATM.`;

  return `
    <h3>
      <span>Tile 4: Contract Picker <span style="color:var(--axis);font-size:10px;font-weight:400;">(loading live data…)</span></span>
      <button class="help-icon" data-help="tile6">?</button>
    </h3>
    <div class="picker-scroll-hint">↔ swipe table to see Vol / OI / Spread / Structure</div>
    <div class="picker-scroll">
      <table class="picker-table">
        <thead><tr>
          <th>Strike</th><th>Exp</th><th>Bid×Ask</th><th>Mid</th>
          <th data-tooltip-trigger="cost_per_day">Cost/day</th>
          <th>Vol</th><th>OI</th><th>Spread%</th><th>Structure</th>
        </tr></thead>
        <tbody>
          ${gate3FailWarning}
          ${mainRows}
          ${divider}
          ${thisWeek}
        </tbody>
      </table>
    </div>
    <div style="margin-top:10px; font-size:10px; color:var(--axis); font-family:var(--ff-mono);">
      ${footer} App does not execute — take ticker + strike + exp to your broker.
    </div>
  `;
}

function termCurveSvg(curve, tradedExpiry) {
  if (!curve || curve.length < 2) return `<div class="t4-term-na">term curve unavailable</div>`;
  const W = 560, H = 90, padL = 30, padR = 10, padT = 10, padB = 16;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const dtes = curve.map(p => p.dte), ivs = curve.map(p => p.iv);
  const minD = Math.min(...dtes), maxD = Math.max(...dtes) || 1;
  const minV = Math.min(...ivs), maxV = Math.max(...ivs);
  const vSpan = (maxV - minV) || 1, dSpan = (maxD - minD) || 1;
  const x = d => padL + innerW * (Math.log(d + 1) - Math.log(minD + 1)) / (Math.log(maxD + 1) - Math.log(minD + 1));
  const y = v => padT + innerH * (1 - (v - minV) / vSpan);
  const pts = curve.map(p => `${x(p.dte).toFixed(1)},${y(p.iv).toFixed(1)}`).join(" ");
  // back-month reference = average IV of the longer-dated half
  const back = ivs.slice(Math.floor(ivs.length / 2));
  const backAvg = back.reduce((a, b) => a + b, 0) / back.length;
  const yBack = y(backAvg);
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:90px;display:block;">`;
  svg += `<line x1="${padL}" x2="${W - padR}" y1="${yBack.toFixed(1)}" y2="${yBack.toFixed(1)}" stroke="var(--axis)" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>`;
  svg += `<text x="${W - padR}" y="${(yBack - 3).toFixed(1)}" text-anchor="end" fill="var(--axis)" font-size="8" font-family="JetBrains Mono,monospace">back avg ${backAvg.toFixed(0)}</text>`;
  svg += `<polyline points="${pts}" fill="none" stroke="var(--hot)" stroke-width="2"/>`;
  for (const p of curve) svg += `<circle cx="${x(p.dte).toFixed(1)}" cy="${y(p.iv).toFixed(1)}" r="2" fill="var(--hot)"/>`;
  // mark the traded expiry
  const traded = curve.find(p => true);
  if (curve[0]) {
    const tx = x(curve[0].dte), ty = y(curve[0].iv);
    svg += `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="3.5" fill="none" stroke="var(--warn)" stroke-width="1.5"/>`;
    svg += `<text x="${tx.toFixed(1)}" y="${(ty - 6).toFixed(1)}" text-anchor="middle" fill="var(--warn)" font-size="8" font-family="JetBrains Mono,monospace">this wk</text>`;
  }
  // y labels
  svg += `<text x="2" y="${(padT + 6)}" fill="var(--axis)" font-size="8" font-family="JetBrains Mono,monospace">${maxV.toFixed(0)}</text>`;
  svg += `<text x="2" y="${(padT + innerH)}" fill="var(--axis)" font-size="8" font-family="JetBrains Mono,monospace">${minV.toFixed(0)}</text>`;
  svg += `</svg>`;
  return svg;
}

function showTooltip(key) {
  const t = TOOLTIPS[key];
  if (!t) return;
  const sheet = document.getElementById("tooltip-sheet");
  sheet.innerHTML = `
    <h4>${t.title} <button class="close-btn" id="tooltip-close">×</button></h4>
    <div class="section"><div class="label">What it is</div><div class="body">${t.whatItIs}</div></div>
    <div class="section"><div class="label">Why it matters here</div><div class="body">${t.whyHere}</div></div>
    <div class="section"><div class="label">Our threshold / rule</div><div class="body">${t.threshold}</div></div>
    <div class="provenance"><strong>Data:</strong> ${t.provenance}</div>
  `;
  document.getElementById("tooltip-overlay").classList.add("show");
}

function hideTooltip() {
  document.getElementById("tooltip-overlay").classList.remove("show");
}

document.getElementById("tooltip-overlay").addEventListener("click", (e) => {
  if (e.target.id === "tooltip-overlay" || e.target.id === "tooltip-close") hideTooltip();
});

// Event delegation for all tooltip triggers.
// Intentional 3-way attribute split (skipped Minor #4 namespace consolidation):
//   - data-help            → on dedicated help-icon buttons (one per tile header)
//   - data-tooltip         → on the LIVE/CROSS/PROXY .pill spans (inline metadata badges)
//   - data-tooltip-trigger → on arbitrary inline elements that open a tooltip
//                            (e.g., the Tile 4 curve-line row, Tile 6 cost/day column header)
// Each role has distinct visual semantics, so we keep distinct attributes.
document.body.addEventListener("click", (e) => {
  const helpBtn = e.target.closest(".help-icon");
  if (helpBtn) { showTooltip(helpBtn.dataset.help); return; }
  const pillEl = e.target.closest(".pill");
  if (pillEl) { showTooltip(pillEl.dataset.tooltip); return; }
  const triggerEl = e.target.closest("[data-tooltip-trigger]");
  // Guard: don't open a tooltip when the click originated on a <button> inside
  // the trigger (e.g., the #regime-toggle demo button inside the regime banner).
  // Buttons own their own click semantics — see I-1 fix.
  if (triggerEl && !e.target.closest("button")) {
    showTooltip(triggerEl.dataset.tooltipTrigger);
    return;
  }
});
