[project]
name = "uw-pretrade-brief-v2"
version = "0.2.0"
description = "Weekly options decision dashboard — FastAPI + UW + Gemini, with longitudinal archive"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "requests>=2.31.0",
    "pyarrow>=15.0.0",
    "google-genai>=2.0.0",
    "pydantic>=2.6.0",
    "tzdata>=2026.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "responses>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real UW/Gemini APIs; skipped by default",
]
