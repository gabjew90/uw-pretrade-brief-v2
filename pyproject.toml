[project]
name = "uw-pretrade-brief-v3"
version = "0.1.0"
description = "UW Pretrade Brief v3 — typed 5-stage pipeline over bronze/silver/gold parquet"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.48",
    "requests>=2.34",
    "pydantic>=2.13",
    "pyarrow>=24.0",
    "duckdb>=1.1",
    "google-genai>=2.6",
    "python-dotenv>=1.2",
    "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-mock>=3.15",
    "pytest-asyncio>=1.0",
    "responses>=0.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
